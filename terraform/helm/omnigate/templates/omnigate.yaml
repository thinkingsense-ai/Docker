apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-data
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.omnigate.dataVolumeSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: omnigate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: omnigate
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "omnigate.postgresHost" . }} -U {{ .Values.postgres.user }}; do sleep 2; done
      containers:
        - name: omnigate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "omnigate.fullname" . }}-omnigate-config
            - secretRef:
                name: {{ include "omnigate.fullname" . }}-omnigate-secret
          ports:
            - name: http
              containerPort: 8080
            - name: ask
              containerPort: 8081
            - name: oracle-wire
              containerPort: 1521
            - name: pg-wire
              containerPort: 5433
            - name: mysql-wire
              containerPort: 3306
            - name: grpc
              containerPort: 7070
          volumeMounts:
            - name: data
              mountPath: /var/lib/omnigate/data
          readinessProbe:
            # Port 8081, not 8080: once OMNIGATE_ASK_PORT is set, port 8080 (admin-only mode)
            # 404s on bare "/" -- only 8081 (Ask app) still serves it. Confirmed live: the
            # original port-8080 probe caused a permanently NotReady pod after this split, even
            # though the app itself had booted fine and 8081 was already answering.
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.omnigate | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "omnigate.fullname" . }}-omnigate-data
---
# Admin console (port 8080) -- ClusterIP only, deliberately NEVER a public LoadBalancer. The admin
# console is unauthenticated by default (per the app's own README warning); OMNIGATE_ASK_PORT is
# what makes it possible to keep it off the public LoadBalancer while still exposing the Ask app,
# by making 8080 stop serving Ask app routes and 8081 stop serving /admin. Confirmed live this is
# NOT honored by the v0.1.0 image (no effect at all -- see omnigate:v0.1.0 history of this file),
# but IS honored starting with v0.2.0 (confirmed live: distinct "admin console/API only" vs.
# "Ask app only" listeners logged on 8080/8081 respectively). Reach the admin console with
# `kubectl port-forward svc/omnigate-omnigate-admin 8080:8080`.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-admin
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Ask app only (port 8081, via OMNIGATE_ASK_PORT) -- the public LoadBalancer.
#
# Uses OCI's Network Load Balancer (L4 passthrough), not the classic L7 "lb" default: confirmed
# live that the classic Load Balancer buffers the Ask app's SSE (Server-Sent Events) streaming
# responses -- a request would return 200 with only the first event and then hang indefinitely,
# while the exact same request against the pod directly (bypassing the LB) streamed correctly and
# fast. The NLB doesn't do HTTP-level buffering at all, since it's pure TCP passthrough.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-ask
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: ask
      port: {{ .Values.service.askPort }}
      targetPort: 8081
{{- if .Values.omnigate.exposeWireProtocols }}
---
# Wire protocols (Oracle/Postgres/MySQL/gRPC), only created when exposeWireProtocols=true.
# NLB here too -- these are raw TCP wire protocols, not HTTP, so L4 passthrough is the correct
# fit regardless of the SSE-buffering issue that motivated it for the HTTP Service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-wire
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: oracle-wire
      port: 1521
      targetPort: 1521
    - name: pg-wire
      port: 5433
      targetPort: 5433
    - name: mysql-wire
      port: 3306
      targetPort: 3306
    - name: grpc
      port: 7070
      targetPort: 7070
{{- end }}
