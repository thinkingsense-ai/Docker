# Supply chain fixture, Tier B, fully self-contained: one command, no other repo, no manual seed
# step -- `docker compose up` here stands up a real Postgres (auto-seeded with all four supply-
# chain schemas via seed.sql) and an OmniGate container already pointed at all four, built from
# this repo's own root Dockerfile (which bundles a real local reasoning model -- see the root
# README's "The bundled local reasoning model" section -- so this works with zero external API
# key too, via OMNIGATE_LLM_MODE=local-first: the bundled model answers locally, and only
# escalates to a configured OMNIGATE_LLM_API_KEY, if you set one, when its own answer looks
# structurally unusable).
#
# Usage (from this directory):
#   docker compose up --build
# Then open http://localhost:8080/, log in demo/demo, and ask the canonical question from
# ../README.md ("List each purchase order whose shipment status is exactly IN_TRANSIT...").
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "5443:5432" # external 5443 -- avoids clashing with both a host-local Postgres (5432) and the root compose's own Postgres (5442)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  omnigate:
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Four real schemas in ONE Postgres -- but the FREE edition caps at 3 named backends
      # (confirmed live: a naive 4-backend config silently drops the 4th, "logistics", and
      # quietly breaks the canonical question below). Real fix, not a workaround that loses data:
      # `inventory` and `logistics` share ONE backend via a comma-separated ?currentSchema=
      # (a real, native Postgres search_path -- confirmed live: `SET search_path TO
      # inventory,logistics` genuinely resolves tables from both schemas unqualified), so this
      # stays at 3 backends while still querying all four real schemas. Commercial edition has no
      # backend cap -- split them back into 4 separate backends there if you'd rather.
      OMNIGATE_BACKENDS: "suppliers=jdbc:postgresql://postgres:5432/postgres?currentSchema=suppliers|postgres|postgres;inventory=jdbc:postgresql://postgres:5432/postgres?currentSchema=inventory,logistics|postgres|postgres;procurement=jdbc:postgresql://postgres:5432/postgres?currentSchema=procurement|postgres|postgres"
      OMNIGATE_ROUTER_SCHEMA_RULES: "suppliers:suppliers,inventory:inventory,logistics:inventory,procurement:procurement"
      # The wire-proxy/schema-introspection surface (distinct from OMNIGATE_BACKENDS above, which
      # populates the backend registry the Ask app/NL2SQL actually query against) -- scoped to one
      # of the four schemas so schema introspection has a sane single default backend to fall back
      # to; the real catalog used for NL2SQL comes from auto-introspecting every OMNIGATE_BACKENDS
      # entry, this is just the wire-proxy's own connection target.
      OMNIGATE_PG_HOST: postgres
      OMNIGATE_PG_PORT: "5432"
      OMNIGATE_PG_DATABASE: "postgres?currentSchema=suppliers"
      OMNIGATE_PG_USER: postgres
      OMNIGATE_PG_PASSWORD: postgres
      # local-first: answers with the bundled local model first (real, private, no API key
      # needed), escalating to OMNIGATE_LLM_API_KEY below only if it's set AND the local answer
      # looks structurally unusable. Set OMNIGATE_LLM_MODE=local-only for a hard "nothing ever
      # leaves this container" guarantee instead -- see the Server repo's LlmMode for all four.
      OMNIGATE_LLM_MODE: local-first
      OMNIGATE_LLM_API_KEY: ${OMNIGATE_LLM_API_KEY:-}
      # The Ask app (http://localhost:8080/) ALWAYS requires a real login. Real working demo
      # account, username "demo", password "demo" (generated the same way the root
      # docker-compose.yml's own comment documents) -- change or remove before running anywhere
      # reachable beyond your own machine.
      OMNIGATE_APP_USERS: "demo:Ymae2Zt5+eMgPcZ9rMZH6w==:ZCqdKxPoJLLRofXeu1wy35ceWdW1fN9whwgrDoPB+GI=::"
      # Admin console/API is UNAUTHENTICATED unless one of these is set -- uncomment before
      # exposing this compose stack beyond localhost:
      # OMNIGATE_AUTH_USERS: "admin:<saltB64>:<hashB64>:admin"
      # OMNIGATE_AUTH_API_TOKENS: "changeme-token:admin"
    ports:
      - "1521:1521"   # Oracle wire
      - "5433:5433"   # Postgres wire
      - "3306:3306"   # MySQL wire
      - "7070:7070"   # native gRPC JDBC driver
      - "8080:8080"   # HTTP admin console/API (/admin, /api/*) and the Ask app UI (/)
