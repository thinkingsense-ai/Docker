# Supply chain fixture, Tier B, fully self-contained: one command, no other repo, no manual seed
# step -- `docker compose up` here stands up a real Postgres (auto-seeded with all four supply-
# chain schemas via seed.sql), three real local-model sidecar containers (Qwen for the agentic
# tier, SmolLM3 for Semantic Router's fast tier, TabPFN for predictive intelligence), and an
# OmniGate container -- kept deliberately small itself now -- connecting to all of them over the
# Compose network, plus all four Postgres schemas. Zero external API key needed at all: every
# model this stack uses is a real, local sidecar container, same "no external dependency" story
# the root Dockerfile's own bundled-model version used to make, just as separate containers now
# (see the root Dockerfile's own comment on why: a smaller main image, and each model's own
# resource/lifecycle managed by Compose the same way Postgres's already is).
#
# Usage (from this directory):
#   docker compose up --build
# First run downloads real model weights into each sidecar image (Qwen ~2GB, SmolLM3 ~2GB, plus
# TabPFN's own ~29MB checkpoint on its first real prediction) -- expect several minutes. Then open
# http://localhost:8080/, log in demo/demo, and ask the canonical question from ../README.md
# ("List each purchase order whose shipment status is exactly IN_TRANSIT...").
#
# Real, live-confirmed memory limitation, not a guess: running Postgres + OmniGate + THREE real
# local-model sidecars (two llama-server instances, one with real torch/TabPFN) at once needs
# meaningfully more memory than the ~7-8GB single-container setup this fixture used before sidecars
# existed. If your host is memory-constrained, comment out the smollm3-model and/or tabpfn-predictor
# services and their matching OMNIGATE_*_REMOTE_HOST lines below -- each sidecar is independently
# optional (see GatewayComponents#remoteLlamaOrNull's own "absent means the feature doesn't exist"
# convention), Semantic Router's FAST/PREDICTIVE tiers just fall back to the agentic model/an honest
# refusal respectively when their own sidecar isn't configured.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "5443:5432" # external 5443 -- avoids clashing with both a host-local Postgres (5432) and the root compose's own Postgres (5442)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Agentic-tier reasoning model -- Qwen2.5-3B-Instruct, real, non-commercial-only license (see
  # ../../../sidecars/llama/Dockerfile's own comment) -- the free/dev-only default this fixture
  # itself already is. Exposes the OpenAI-/v1/chat/completions-compatible API llama-server speaks.
  qwen-model:
    build:
      context: ../../../sidecars/llama
      dockerfile: Dockerfile
      args:
        MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

  # Semantic Router's fast tier (com.omnigate.nl2sql.SemanticTier.FAST) -- SmolLM3-3B, real
  # Apache-2.0, genuinely commercially usable (see ../../../sidecars/llama/Dockerfile's own
  # comment). Same image as qwen-model, different MODEL_URL build arg -- they're structurally
  # identical containers.
  smollm3-model:
    build:
      context: ../../../sidecars/llama
      dockerfile: Dockerfile
      args:
        MODEL_URL: https://huggingface.co/unsloth/SmolLM3-3B-GGUF/resolve/main/SmolLM3-3B-Q4_K_M.gguf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

  # Predictive intelligence (com.omnigate.nl2sql.SemanticTier.PREDICTIVE) -- real TabPFN-2, on by
  # default in this sidecar image (see ../../../sidecars/tabpfn/Dockerfile's own comment for why,
  # unlike the Server repo's own off-by-default OMNIGATE_PROFILING_TABPFN_ENABLED).
  tabpfn-predictor:
    build:
      context: ../../../sidecars/tabpfn
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 15

  omnigate:
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      qwen-model:
        condition: service_healthy
      smollm3-model:
        condition: service_healthy
      tabpfn-predictor:
        condition: service_healthy
    environment:
      # Four real schemas in ONE Postgres -- but the FREE edition caps at 3 named backends
      # (confirmed live: a naive 4-backend config silently drops the 4th, "logistics", and
      # quietly breaks the canonical question below). Real fix, not a workaround that loses data:
      # `inventory` and `logistics` share ONE backend via a comma-separated ?currentSchema=
      # (a real, native Postgres search_path -- confirmed live: `SET search_path TO
      # inventory,logistics` genuinely resolves tables from both schemas unqualified), so this
      # stays at 3 backends while still querying all four real schemas. Commercial edition has no
      # backend cap -- split them back into 4 separate backends there if you'd rather.
      OMNIGATE_BACKENDS: "suppliers=jdbc:postgresql://postgres:5432/postgres?currentSchema=suppliers|postgres|postgres;inventory=jdbc:postgresql://postgres:5432/postgres?currentSchema=inventory,logistics|postgres|postgres;procurement=jdbc:postgresql://postgres:5432/postgres?currentSchema=procurement|postgres|postgres"
      OMNIGATE_ROUTER_SCHEMA_RULES: "suppliers:suppliers,inventory:inventory,logistics:inventory,procurement:procurement"
      # The wire-proxy/schema-introspection surface (distinct from OMNIGATE_BACKENDS above, which
      # populates the backend registry the Ask app/NL2SQL actually query against) -- scoped to one
      # of the four schemas so schema introspection has a sane single default backend to fall back
      # to; the real catalog used for NL2SQL comes from auto-introspecting every OMNIGATE_BACKENDS
      # entry, this is just the wire-proxy's own connection target.
      OMNIGATE_PG_HOST: postgres
      OMNIGATE_PG_PORT: "5432"
      OMNIGATE_PG_DATABASE: "postgres?currentSchema=suppliers"
      OMNIGATE_PG_USER: postgres
      OMNIGATE_PG_PASSWORD: postgres
      # local-first: answers with the real sidecar agentic model first (real, private, no API key
      # needed), escalating to OMNIGATE_LLM_API_KEY below only if it's set AND the local answer
      # looks structurally unusable. Set OMNIGATE_LLM_MODE=local-only for a hard "nothing ever
      # leaves this container" guarantee instead -- see the Server repo's LlmMode for all four.
      OMNIGATE_LLM_MODE: local-first
      OMNIGATE_LLM_API_KEY: ${OMNIGATE_LLM_API_KEY:-}
      # Real Docker Compose sidecar mode (see GatewayComponents#remoteLlamaOrNull's own javadoc) --
      # OmniGate connects to the three model containers above over the Compose network by their
      # real service name, instead of spawning any local subprocess/needing any model file bundled
      # into this container at all. Each is independently optional: comment out a sidecar service
      # above AND its matching *_REMOTE_HOST line here to run without it (Semantic Router degrades
      # cleanly per-tier, see this file's own header comment on memory-constrained hosts).
      OMNIGATE_ASSISTANT_REMOTE_HOST: qwen-model
      OMNIGATE_ASSISTANT_REMOTE_PORT: "8090"
      OMNIGATE_FAST_ASSISTANT_REMOTE_HOST: smollm3-model
      OMNIGATE_FAST_ASSISTANT_REMOTE_PORT: "8090"
      OMNIGATE_PROFILING_SERVER_REMOTE_HOST: tabpfn-predictor
      OMNIGATE_PROFILING_SERVER_REMOTE_PORT: "8092"
      # Real, live-confirmed limitation carried over from the pre-sidecar version of this fixture:
      # a SEPARATE embedding-mode llama-server instance (used for ontology vector search/question-
      # bank semantic search, not NL2SQL itself) is real extra memory on top of the three sidecars
      # above. Left disabled by default here -- set OMNIGATE_EMBEDDING_REMOTE_HOST to a fourth
      # llama-server sidecar (started in --embeddings mode; see sidecars/llama/Dockerfile) on a
      # host with the memory headroom for it.
      OMNIGATE_EMBEDDING_MODEL_PATH: /opt/omnigate/no-embedding-model-here.gguf
      # The Ask app (http://localhost:8080/) ALWAYS requires a real login. Real working demo
      # account, username "demo", password "demo" (generated the same way the root
      # docker-compose.yml's own comment documents) -- change or remove before running anywhere
      # reachable beyond your own machine.
      OMNIGATE_APP_USERS: "demo:Ymae2Zt5+eMgPcZ9rMZH6w==:ZCqdKxPoJLLRofXeu1wy35ceWdW1fN9whwgrDoPB+GI=::"
      # Admin console/API is UNAUTHENTICATED unless one of these is set -- uncomment before
      # exposing this compose stack beyond localhost:
      # OMNIGATE_AUTH_USERS: "admin:<saltB64>:<hashB64>:admin"
      # OMNIGATE_AUTH_API_TOKENS: "changeme-token:admin"
    ports:
      - "1521:1521"   # Oracle wire
      - "5433:5433"   # Postgres wire
      - "3306:3306"   # MySQL wire
      - "7070:7070"   # native gRPC JDBC driver
      - "8080:8080"   # HTTP admin console/API (/admin, /api/*) and the Ask app UI (/)
