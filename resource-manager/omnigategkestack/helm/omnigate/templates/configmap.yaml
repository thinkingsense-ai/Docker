apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-config
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  # For the admin Infrastructure page (thinkingsense-ai/Server#31): how many replicas this release asked for (so a replica that never joined shows as
  # "1 of 2"), and how to find this deployment's pods when the Kubernetes view is on (observability-rbac.yaml grants the read access).
  OMNIGATE_EXPECTED_REPLICAS: "1"
  OMNIGATE_KUBERNETES_VIEW: {{ .Values.observability.kubernetes.enabled | quote }}
  OMNIGATE_KUBERNETES_NODES: {{ and .Values.observability.kubernetes.enabled .Values.observability.kubernetes.nodes | quote }}
  OMNIGATE_KUBERNETES_SELECTOR: "app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=omnigate"
  # OMNIGATE_LLM_MODEL intentionally NOT set here -- same known issue as the OCI/AWS charts
  # (thinkingsense-ai/Server#3): setting it explicitly causes every Ask-app question to fail with
  # a NullPointerException in AnthropicLlmProvider.planSteps. Leaving it unset falls back to the
  # app's own internal default model, which works correctly.
  #
  # Routes each schema-qualified table reference to the backend name that owns it (see
  # OMNIGATE_BACKENDS in secrets.yaml) -- three schemas, three natural-named backends, no
  # merging needed (stays within the free edition's 3-backend cap, same as the other two clouds).
{{- if include "omnigate.packs" . }}
  # all-packs: no schema-to-source rules. Every schema of each source is discovered and addressed connector.schema.table (pg.risk.incidents,
  # mdb.security.vendors, files.museums); a rule here would rewrite the schema part to the source name and break cross-source questions.
  OMNIGATE_FEDERATION_AUTO_DISCOVER_SCHEMAS: "true"
  OMNIGATE_FEDERATION_SCHEMA_INCLUDE: "suppliers,inventory,procurement,risk,smithsonian,security,museums"
  # Serve an approved question's saved SQL when a new question matches it closely (the packs' questions are checked to run).
  OMNIGATE_QUESTION_BANK_RETRIEVAL_ENABLED: "true"
  # The embedding model runs as its own Deployment (packs.yaml): question matching, the subject vocabulary and vector search call it there.
  OMNIGATE_EMBEDDING_REMOTE_HOST: {{ include "omnigate.embedHost" . | quote }}
  OMNIGATE_EMBEDDING_REMOTE_PORT: "8090"
{{- else }}
  OMNIGATE_ROUTER_SCHEMA_RULES: {{ ternary "risk:risk,security:security" "suppliers:suppliers,inventory:inventory,procurement:procurement" (eq .Values.demoDataset "it-risk") | quote }}
{{- end }}
  # OMNIGATE_PG_HOST/PORT/DATABASE/USER are the wire-proxy surface's own single connection target,
  # distinct from OMNIGATE_BACKENDS (which populates the backend registry the Ask app/NL2SQL
  # actually queries against) -- must ALWAYS be set, not just when wire protocols are exposed: see
  # the identical comment in the OCI/AWS charts (thinkingsense-ai/Server#5, #8) -- without them,
  # agentic multi-step query execution falls back to a hardcoded localhost:5432 default that
  # doesn't exist. Deliberately pointed at the plain `postgres` database with NO
  # `?currentSchema=` override (Postgres's own empty `public` schema), not any of the three real
  # schemas, to avoid SchemaIntrospector.sourcesFor() synthesizing a colliding extra catalog
  # source -- same reasoning as the other two clouds' charts, unchanged for GKE.
  OMNIGATE_PG_HOST: {{ include "omnigate.postgresHost" . | quote }}
  OMNIGATE_PG_PORT: "5432"
  OMNIGATE_PG_DATABASE: {{ .Values.postgres.database | quote }}
  OMNIGATE_PG_USER: {{ .Values.postgres.readOnlyUser | quote }}
  # OMNIGATE_BACKENDS lives in secrets.yaml, not here -- it embeds the Postgres password, which
  # has no business sitting in a plaintext ConfigMap alongside a real Secret already carrying the
  # same value.
---
{{- if and (ne .Values.demoDataset "it-risk") (not (include "omnigate.packs" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-supply-chain
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-supply-chain.sql: |
{{ .Files.Get "files/seed-supply-chain.sql" | indent 4 }}
---
{{- end }}
{{- if and .Values.manufacturingDemo.enabled (ne .Values.demoDataset "it-risk") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-manufacturing
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-manufacturing.sql: |
{{ .Files.Get "files/seed-manufacturing.sql" | indent 4 }}
{{- end }}

{{- if include "omnigate.packs" . }}
---
# The Postgres half of all-packs, run by the image's first-start entrypoint in file-name order on an empty volume: the supply-chain
# schemas, then the risk schema. Manufacturing is added by the ensure-manufacturing-demo init container, Smithsonian by the packs-loader Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-packs-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  01-seed-supply-chain.sql: |
{{ .Files.Get "files/seed-supply-chain.sql" | indent 4 }}
  02-seed-it-risk-postgres.sql: |
{{ .Files.Get "files/seed-it-risk-postgres.sql" | indent 4 }}
{{- end }}

{{- if include "omnigate.hasMariadb" . }}
{{- if eq .Values.demoDataset "it-risk" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-it-risk-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-it-risk-postgres.sql: |
{{ .Files.Get "files/seed-it-risk-postgres.sql" | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-it-risk-mariadb
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  01-seed-it-risk.sql: |
{{ .Files.Get "files/seed-it-risk-mariadb.sql" | indent 4 }}
  # The image grants the account it creates (MARIADB_USER) everything on the database; narrow that to SELECT.
  02-readonly.sql: |
    REVOKE ALL PRIVILEGES ON security.* FROM '{{ .Values.mariadb.readOnlyUser }}'@'%';
    GRANT SELECT ON security.* TO '{{ .Values.mariadb.readOnlyUser }}'@'%';
    FLUSH PRIVILEGES;
{{- end }}
