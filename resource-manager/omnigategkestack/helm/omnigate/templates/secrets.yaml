{{- /*
The key that encrypts the app's stored settings (source passwords, tokens, the model key) at rest, OMNIGATE_CONFIG_ENCRYPTION_KEY. Its value is, in order:
the one you set (configEncryption.key), the one already stored in the -config-key Secret (so an upgrade keeps it), or a new random one on first
install. The Secret is kept when the release is uninstalled (helm.sh/resource-policy: keep, below): settings encrypted under a key that is then
lost cannot be read back, so the key must outlive the release for as long as the data volume might. `lookup` needs a live cluster, so `helm template`
shows a fresh random value each time; that is expected.
*/ -}}
{{- $cfgKeySecretName := printf "%s-config-key" (include "omnigate.fullname" .) -}}
{{- $cfgKey := .Values.configEncryption.key -}}
{{- if and .Values.configEncryption.enabled (not $cfgKey) -}}
{{- $existingCfg := lookup "v1" "Secret" .Release.Namespace $cfgKeySecretName -}}
{{- if and $existingCfg $existingCfg.data (hasKey $existingCfg.data "OMNIGATE_CONFIG_ENCRYPTION_KEY") -}}
{{- $cfgKey = index $existingCfg.data "OMNIGATE_CONFIG_ENCRYPTION_KEY" | b64dec -}}
{{- else -}}
{{- $cfgKey = randAlphaNum 32 | b64enc -}}
{{- end -}}
{{- end -}}
{{- /*
The SELECT-only database account the app connects as (see the ensure-readonly-role init container in the pod template). Its
password is, in order: the one you set (postgres.readOnlyPassword), the one already stored in the -postgres-ro-secret Secret
(so an upgrade keeps it), or a new random one on first install. `lookup` needs a live cluster, so `helm template` and
`helm lint` show a fresh random value each time; that is expected.
*/ -}}
{{- /*
The postgres superuser's password, in order: the one you set (postgres.password), the one already stored in the -postgres-secret Secret
(so an upgrade keeps it, and a stack installed with the old default keeps "postgres"), or a new random one on first install. The Secret is
kept when the release is uninstalled (helm.sh/resource-policy: keep, below), so a reinstall onto the database volume the old release left
behind finds the same password; a volume initialised with one password and a Secret holding another would leave the database unreachable.
*/ -}}
{{- $suSecretName := printf "%s-postgres-secret" (include "omnigate.fullname" .) -}}
{{- $suPw := .Values.postgres.password -}}
{{- if not $suPw -}}
{{- $existingSu := lookup "v1" "Secret" .Release.Namespace $suSecretName -}}
{{- if and $existingSu $existingSu.data (hasKey $existingSu.data "POSTGRES_PASSWORD") -}}
{{- $suPw = index $existingSu.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $suPw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $roUser := .Values.postgres.readOnlyUser -}}
{{- $roSecretName := printf "%s-postgres-ro-secret" (include "omnigate.fullname" .) -}}
{{- $roPw := .Values.postgres.readOnlyPassword -}}
{{- if not $roPw -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $roSecretName -}}
{{- if and $existing $existing.data (hasKey $existing.data "PG_RO_PASSWORD") -}}
{{- $roPw = index $existing.data "PG_RO_PASSWORD" | b64dec -}}
{{- else -}}
{{- $roPw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- /*
The IT & operational risk pack's MariaDB passwords (only used when demoDataset is it-risk): the root password and the SELECT-only account's
password. Each is, in order: the one you set (mariadb.password / mariadb.readOnlyPassword), the one already stored in the -mariadb-secret
Secret (so an upgrade keeps it), or a new random one on first install. The Secret is kept on uninstall, like the Postgres one, because the
volume outlives the release and was initialised with these passwords. `lookup` needs a live cluster, so `helm template` shows fresh values.
*/ -}}
{{- $mdbSecretName := printf "%s-mariadb-secret" (include "omnigate.fullname" .) -}}
{{- $mdbRootPw := .Values.mariadb.password -}}
{{- $mdbRoPw := .Values.mariadb.readOnlyPassword -}}
{{- $riskBackends := "" -}}
{{- if eq .Values.demoDataset "it-risk" -}}
{{- $existingMdb := lookup "v1" "Secret" .Release.Namespace $mdbSecretName -}}
{{- if not $mdbRootPw -}}
{{- if and $existingMdb $existingMdb.data (hasKey $existingMdb.data "MARIADB_ROOT_PASSWORD") -}}
{{- $mdbRootPw = index $existingMdb.data "MARIADB_ROOT_PASSWORD" | b64dec -}}
{{- else -}}
{{- $mdbRootPw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- if not $mdbRoPw -}}
{{- if and $existingMdb $existingMdb.data (hasKey $existingMdb.data "MARIADB_PASSWORD") -}}
{{- $mdbRoPw = index $existingMdb.data "MARIADB_PASSWORD" | b64dec -}}
{{- else -}}
{{- $mdbRoPw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- /* Each source is registered under the same name as its schema / database ("risk", "security"): the federation planner needs that. */ -}}
{{- $riskBackends = printf "risk=jdbc:postgresql://%s:5432/%s?currentSchema=risk|%s|%s;security=jdbc:mariadb://%s:3306/security|%s|%s" (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw (include "omnigate.mariadbHost" .) .Values.mariadb.readOnlyUser $mdbRoPw -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGATE_LLM_API_KEY: {{ .Values.omnigate.llmApiKey | quote }}
{{- if .Values.omnigate.authUsers }}
  OMNIGATE_AUTH_USERS: {{ .Values.omnigate.authUsers | quote }}
{{- end }}
{{- if .Values.omnigate.adminApiToken }}
  OMNIGATE_AUTH_API_TOKENS: {{ printf "%s:admin" .Values.omnigate.adminApiToken | quote }}
{{- end }}
  OMNIGATE_APP_USERS: {{ required "omnigate.appUsers is required -- generated automatically during `terraform apply` by password-hash.tf. Refusing to deploy with the repo's well-known demo/demo login on an internet-facing LoadBalancer." .Values.omnigate.appUsers | quote }}
  # Three real schemas (see files/seed-supply-chain.sql) in ONE Postgres, registered as three
  # natural-named backends (suppliers/inventory/procurement) -- same shape as the OCI/AWS charts,
  # unchanged for GKE.
  OMNIGATE_BACKENDS: {{ ternary $riskBackends (printf "suppliers=jdbc:postgresql://%s:5432/%s?currentSchema=suppliers|%s|%s;inventory=jdbc:postgresql://%s:5432/%s?currentSchema=inventory|%s|%s;procurement=jdbc:postgresql://%s:5432/%s?currentSchema=procurement|%s|%s" (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw) (eq .Values.demoDataset "it-risk") | quote }}
  # Pairs with the always-set OMNIGATE_PG_HOST/PORT/DATABASE/USER in configmap.yaml.
  OMNIGATE_PG_PASSWORD: {{ $roPw | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-postgres-secret
  annotations:
    # Not removed by `helm uninstall`: see the note at the top of this file.
    "helm.sh/resource-policy": keep
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $suPw | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
{{- if and .Values.image.pullUsername .Values.image.pullAuthToken }}
---
# Only rendered when image.pullUsername/pullAuthToken are set (see values.yaml's own comment) --
# a private image repository (e.g. a commercial build kept out of the free image's public,
# anonymously-pullable OCIR repo) needs OKE's nodes to actually authenticate to pull it, unlike
# the default public-repo path. Registry hostname is derived from image.repository itself
# (everything before the first "/"), not a separate setting, so it can't drift out of sync.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-imagepull
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # `| quote` is load-bearing, not cosmetic: this value starts with "{", and an unquoted YAML
  # scalar starting with "{" is parsed as a flow-style mapping, not a string -- confirmed live,
  # the Kubernetes API rejected the whole Secret ("cannot unmarshal object into Go struct field
  # Secret.stringData of type string") even though `helm template`'s raw text output looked
  # correct at a glance (it takes a real apply against a live API server to catch this, not just
  # reading the rendered YAML).
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" (first (splitList "/" .Values.image.repository)) .Values.image.pullUsername .Values.image.pullAuthToken (printf "%s:%s" .Values.image.pullUsername .Values.image.pullAuthToken | b64enc) | quote }}
{{- end }}

---
# The app's SELECT-only database account (created by the ensure-readonly-role init container; used by the init container
# and, through OMNIGATE_BACKENDS / OMNIGATE_PG_PASSWORD above, by the app). Kept as its own Secret so an upgrade can read the
# generated password back with `lookup` instead of generating a new one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $roSecretName }}
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  PG_RO_USER: {{ $roUser | quote }}
  PG_RO_PASSWORD: {{ $roPw | quote }}

{{- if .Values.configEncryption.enabled }}
---
# AES key for the app's stored settings (see the note at the top of this file). A base64 string of 32 bytes, as the app expects.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfgKeySecretName }}
  annotations:
    # Not removed by `helm uninstall`: see the note at the top of this file.
    "helm.sh/resource-policy": keep
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGATE_CONFIG_ENCRYPTION_KEY: {{ $cfgKey | quote }}
{{- end }}

{{- if eq .Values.demoDataset "it-risk" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mdbSecretName }}
  annotations:
    # Not removed by `helm uninstall`: see the note above.
    "helm.sh/resource-policy": keep
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ $mdbRootPw | quote }}
  MARIADB_USER: {{ .Values.mariadb.readOnlyUser | quote }}
  MARIADB_PASSWORD: {{ $mdbRoPw | quote }}
{{- end }}
