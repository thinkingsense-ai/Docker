apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-data
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.omnigate.dataVolumeSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: omnigate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: omnigate
      annotations:
        # Same reasoning as the OCI/AWS charts: envFrom vars are read once at container start, so
        # a Secret/ConfigMap-only change doesn't roll this Deployment on its own. These checksums
        # change whenever the rendered content changes, which is what actually triggers the
        # rollout (this Deployment's `strategy: Recreate` then applies).
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Confirmed live: GKE automatically taints every Arm (T2A) node pool with
      # kubernetes.io/arch=arm64:NoSchedule (undocumented in the AWS/OCI charts because neither
      # cloud's default node type does this -- EKS Graviton nodes and OKE's A1.Flex nodes don't
      # carry an equivalent taint). Without this toleration every pod sits Pending forever with
      # "untolerated taint(s)", never even reaching an image pull. The published omnigate image is
      # arm64-only (see gke.tf's node_machine_type comment), so this pod belongs on that node.
      tolerations:
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "omnigate.postgresHost" . }} -U {{ .Values.postgres.user }}; do sleep 2; done
      containers:
        - name: omnigate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "omnigate.fullname" . }}-omnigate-config
            - secretRef:
                name: {{ include "omnigate.fullname" . }}-omnigate-secret
          ports:
            - name: http
              containerPort: 8080
            - name: oracle-wire
              containerPort: 1521
            - name: pg-wire
              containerPort: 5433
            - name: mysql-wire
              containerPort: 3306
            - name: grpc
              containerPort: 7070
          volumeMounts:
            - name: data
              mountPath: /var/lib/omnigate/data
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.omnigate | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "omnigate.fullname" . }}-omnigate-data
---
# HTTP only (Ask app + admin console) -- the LoadBalancer default. Deliberately not exposing the
# DB wire ports here; see the wire-protocols Service below, which is opt-in.
#
# No cloud-specific annotation needed here, unlike the OCI chart (which has to explicitly request
# `oci.oraclecloud.com/load-balancer-type: "nlb"` to avoid OCI's classic L7 LB buffering the Ask
# app's SSE streaming responses). A plain `type: LoadBalancer` Service on GKE already provisions
# an external passthrough Network Load Balancer by default -- pure L4/TCP, no HTTP-level buffering
# to worry about in the first place.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-http
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: 8080
{{- if .Values.omnigate.exposeWireProtocols }}
---
# Wire protocols (Oracle/Postgres/MySQL/gRPC), only created when exposeWireProtocols=true. Same
# default external passthrough LB as the HTTP Service above -- raw TCP wire protocols, L4
# passthrough is the correct fit regardless.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-wire
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: oracle-wire
      port: 1521
      targetPort: 1521
    - name: pg-wire
      port: 5433
      targetPort: 5433
    - name: mysql-wire
      port: 3306
      targetPort: 3306
    - name: grpc
      port: 7070
      targetPort: 7070
{{- end }}
