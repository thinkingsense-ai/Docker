# Defaults here are overridden by ../../helm-release.tf when deployed via `terraform apply` -- see
# variables.tf for which of these become end-user-facing inputs.

image:
  # Set by Terraform to the Artifact Registry repo the stack just pushed to
  # (<region>-docker.pkg.dev/<project-id>/omnigate/omnigate).
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
  # Only needed for a private image repository (the commercial edition's image). Blank for the default public free-image path.
  # pullUsername is OCIR's "<tenancy-namespace>/<oci-username>"; pullAuthToken is an OCI Auth Token. When set, this chart creates a
  # kubernetes.io/dockerconfigjson Secret and wires it into the pod's imagePullSecrets; the registry hostname comes from
  # image.repository (everything before the first "/").
  pullUsername: ""
  pullAuthToken: ""

omnigate:
  llmModel: claude-sonnet-5
  # Anthropic API key -- required, no default on purpose (NL2SQL simply won't work without it,
  # same as the local compose setup and both other cloud stacks). Injected into a Secret, never a
  # ConfigMap.
  llmApiKey: ""
  # "username:saltB64:hashB64::" -- generated server-side during `terraform apply` by
  # ../../password-hash.tf, same as the OCI stack. No default: shipping the repo's well-known
  # demo/demo credential on an internet-reachable LoadBalancer would be a real exposure, so the
  # chart intentionally requires this to be set.
  appUsers: ""
  # Admin console logins (OMNIGATE_AUTH_USERS: "user:saltB64:hashB64:admin[,...]"). Setting it turns admin
  # authentication on for the admin console, admin API and /mcp. The cloud stacks always set it; a bare
  # `helm install` leaves the admin console open.
  authUsers: ""
  # Bearer token with admin rights for the admin API (OMNIGATE_AUTH_API_TOKENS), for scripts.
  adminApiToken: ""
  # Signed licence token (ts1.<payload>.<signature>) that lets the free image run as the commercial edition. Blank keeps any
  # licence already in the cluster. See COMMERCIAL.md.
  license: ""
  # Storage for /var/lib/omnigate/data (the embedded ConfigStore -- admin-set config like an API
  # key entered live in the UI). A real PVC here means it survives pod rescheduling.
  dataVolumeSize: 2Gi
  # Wire-protocol ports (Oracle/Postgres/MySQL/gRPC) are ClusterIP-only by default -- opt in
  # explicitly before exposing raw DB wire protocols to the internet.
  exposeWireProtocols: false

postgres:
  # Fully-qualified -- matches the OCI chart's own fix for short-name-mode-enforcing node
  # runtimes; keeping it fully-qualified here too rather than assuming GKE's runtime is more
  # permissive.
  image: docker.io/library/postgres:16-alpine
  user: postgres
  # The superuser's password. Blank (the default): generated on first install and kept on every upgrade (read back from the
  # existing -postgres-secret Secret); a stack installed before this keeps the password it already has, which was "postgres".
  # The app's own container never receives it (it connects as readOnlyUser below), apart from the optional TPC-H backends.
  password: ""
  # The account the app itself connects as: SELECT-only, created (and its password set) by the ensure-readonly-role init
  # container on every pod start, so it also appears on a stack that was installed before this existed. Leave
  # readOnlyPassword blank to have one generated on first install and kept on every upgrade; set it only to choose your own.
  # The postgres superuser above is still used to create it, by the TPC-H loader and by backups.
  readOnlyUser: omnigate_ro
  readOnlyPassword: ""
  database: postgres
  storageSize: 5Gi

# GKE's current CSI-backed default StorageClass (zonal Persistent Disk, ext4, WaitForFirstConsumer
# binding) -- the direct analog of the OCI chart's "oci-bv". Present on every GKE cluster running a
# reasonably current version without needing this stack to create a StorageClass of its own.
storageClassName: standard-rwo

service:
  type: LoadBalancer
  httpPort: 8080
  # Optional: CIDR ranges allowed to reach the load balancer (blank = open). The cloud stacks set this from
  # their "allowed client CIDRs" setting.
  loadBalancerSourceRanges: []

resources:
  omnigate:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # Deliberately no CPU limit -- see the OCI chart's identical comment: a CPU *limit* is
      # enforced via a hard per-scheduling-period CFS quota, which caused reproducible stalls on
      # complex NL2SQL questions needing the embedding-based schema-retrieval step. Requests alone
      # still give the scheduler what it needs for bin-packing.
      memory: 3Gi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Adds a small robotics-hardware data set to the three demo schemas (parts, bills of materials, a standard-parts catalog, supplier
# capabilities and certifications, requests for quote and quotes) and six trusted questions about it. Applied by an init container on
# every pod start, only when the tables are not there yet, so it also reaches a stack that was installed before it existed.
manufacturingDemo:
  enabled: true

# Which demo data set a new install gets. "supply-chain" (the default) is the three-schema supply-chain data above. "it-risk" is the
# IT & operational risk pack for a mid-size financial firm: one Postgres source (`risk`) and one MariaDB source (`security`), so
# questions that join the two show federation. The two sets are alternatives, not additions: the free edition allows three data
# sources and the supply-chain set already uses all three. It is read on a fresh install only (the database is seeded when its volume
# is empty); changing it on an existing release does not reseed. See fixtures/it-risk/README.md.
# Two more standalone sets, chosen the same way (chart value only; not on the deploy forms yet):
#   "bom"      a manufacturing BOM / sourcing set: one Postgres source (`bom`, 22 tables) and 24 trusted questions (demos/bom-pack).
#   "treasury" corporate cash and treasury across two systems: Postgres (`treasury`, 13 tables) and MariaDB (`erp`, 4 tables), 24 trusted
#              questions, four of them joining the two (demos/treasury-pack).
# Like it-risk they replace the supply-chain data rather than add to it, and are read on a fresh install only.
demoDataset: supply-chain
# "all-packs" loads every demo pack at once -- supply chain, manufacturing, IT & operational risk and the Smithsonian Open Access sample -- behind
# the free edition's three data sources: one Postgres source (`pg`, five schemas), one MariaDB source (`mdb`, the `security` database) and the
# museum directory CSV in an in-cluster object store (`files`). Schema auto-discovery is on, tables are addressed connector.schema.table, and the
# Ask app offers the packs as a picker. 28 trusted questions are approved, each checked to run (demos/all-packs/README.md has the rules they follow).
# Like it-risk it is chosen on a fresh install only and is not on the deploy form.

# The MariaDB half of the IT & operational risk pack (only rendered when demoDataset is it-risk).
mariadb:
  image: docker.io/library/mariadb:11
  # The root password. Blank (the default): generated on first install and kept on every upgrade, like postgres.password.
  password: ""
  # The account the app connects as: SELECT-only on the `security` database. Leave readOnlyPassword blank to have one generated.
  readOnlyUser: omnigate_ro
  readOnlyPassword: ""
  storageSize: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Approves a few trusted questions for the seeded supply-chain demo after install, so the Ask app's first
# screen offers questions this data can answer (see templates/seed-questions.yaml). Needs the admin login
# (or omnigate.adminApiToken). Best effort: it never fails the release.
seedDemoQuestions:
  enabled: false
  adminUser: admin
  adminPassword: ""
  image: docker.io/library/python:3.12-slim   # runs the small seeding script (standard library only)

# The embedding model below is also used by the bom and treasury sets. The rest (object store, loader) is read only when demoDataset is all-packs: the object store for the museum directory and the Smithsonian sample the loader Job downloads.
packs:
  bucket: si-poc
  storageSize: 1Gi
  # SeaweedFS, pinned by digest (MinIO no longer publishes free images); the same image the OKE stack's TPC-H store uses.
  s3Image: docker.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  loaderImage: docker.io/library/python:3.12-slim
  # The embedding model the app uses to match a question to an approved one by meaning, and to build the subject vocabulary. The app image
  # carries no model of its own, so this runs as a separate Deployment: the official llama.cpp server (build b10795, pinned by digest; any
  # newer :server build answers "does not support embeddings") serving nomic-embed-text-v1.5 (Apache-2.0, 84 MB), which an init container
  # downloads from Hugging Face and checks against its SHA-256 before the server starts.
  embedImage: ghcr.io/ggml-org/llama.cpp@sha256:fcca4dac388066ca93db561751e8caf5fc7d46d9df5f00a7422026db68468e31
  embedDownloadImage: docker.io/curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
  embedModelUrl: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf
  embedModelSha256: d4e388894e09cf3816e8b0896d81d265b55e7a9fff9ab03fe8bf4ef5e11295ac
  # The Smithsonian sample (5.4 MB) is too large for a ConfigMap, so the loader downloads it from a pinned commit of the public Docker repo and
  # refuses a file whose SHA-256 differs. Change the URL and the checksum together.
  smithsonianDataUrl: https://raw.githubusercontent.com/thinkingsense-ai/Docker/e2ba5b5eb6ce85fbc1a1a5c4ed3cddb88eb35dea/demos/smithsonian-poc/data-src/si_open_access_sample.csv
  smithsonianDataSha256: c5a3599e2cf294608bceca86bbcfb95eb21bfd591b5b7344874830ed55cb1a85

# HTTPS is on by default and plain HTTP is closed on the load balancer. The app serves HTTPS itself (the load balancer is a plain TCP
# pass-through, so the certificate is the app's): with no keystore given, a self-signed certificate is made at first start (browsers warn
# "not trusted" until you supply your own); a keystore (PKCS12, base64) replaces it, and changing it restarts the pods.
# What the app may read about its own deployment, for the admin Infrastructure page (thinkingsense-ai/Server#31). The app only ever reads:
# a namespace-scoped Role (pods, events, volume claims, services, workloads, disruption budgets) and, if "nodes" is on, a cluster-wide read of
# nodes (their ready state and zone). No secrets, no config maps, no pod logs, no exec, and no write of any kind. Switching "enabled" off removes
# the access entirely. Releases of the app before the Infrastructure page ignore all of this.
observability:
  kubernetes:
    enabled: true
    # Node readiness and zone need a ClusterRole (nodes are not namespaced). Turn off where policy forbids a cluster-wide read; the page then
    # shows pods and placement by node name only.
    nodes: true

tls:
  enabled: true
  httpsOnly: true         # false: the load balancer also exposes plain HTTP on 8080
  keystore: ""            # base64 of a PKCS12 file with your certificate and key
  keystorePassword: ""
  port: 443               # the load balancer's HTTPS port (forwards to the app's 8443)

# Restricts who may open a connection to the database pod (and, on OKE, the TPC-H object store) to the pods that need
# it. Enforced only where the cluster's network plugin enforces NetworkPolicy; see the stack README. Harmless elsewhere.
networkPolicy:
  enabled: true

# Encrypts the settings the app stores (source passwords, tokens, the model key) at rest with AES-GCM. On by default: the app's deployment check
# calls an installation without it "not production ready". The key is generated on first install and kept on every upgrade (read back from the
# -config-key Secret, which `helm uninstall` leaves in place); set key (a base64 string of 16, 24 or 32 bytes) only to choose your own. Settings saved
# earlier are encrypted at the next start. Do not delete that Secret while the data volume remains, or the stored settings cannot be read; and an app
# image older than 0.10.12 cannot read encrypted settings, so do not roll back to one after this has run.
configEncryption:
  enabled: true
  key: ""
