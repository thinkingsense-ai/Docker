apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-data
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.omnigate.dataVolumeSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: omnigate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: omnigate
      annotations:
        # A Secret/ConfigMap change alone does not roll this Deployment's pod on its own -- env
        # vars from envFrom are read once at container start, so the existing pod keeps running
        # with its stale environment after a redeploy that only changes e.g. the LLM API key,
        # unless the pod template itself also changes. These checksums do that: they change
        # whenever the rendered Secret/ConfigMap content changes, which is what actually triggers
        # the rollout (this Deployment's own `strategy: Recreate` then applies).
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
{{- if include "omnigate.tlsCustom" . }}
        # The keystore is read once at startup, so a new certificate must roll the pod.
        checksum/tls: {{ include (print $.Template.BasePath "/tls.yaml") . | sha256sum }}
{{- end }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "omnigate.fullname" . }}-omnigate
      # The image runs as uid 10001 (since 0.10.11) and a cloud volume is owned by root, so without fsGroup the pod could not write
      # /var/lib/omnigate/data and the app would stop at startup. Kubernetes gives the volume this group (and group write), including a
      # volume an earlier release created as root, so an upgrade needs no manual chown. OnRootMismatch skips the recursive change on
      # a large volume that is already right.
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
{{- if and .Values.image.pullUsername .Values.image.pullAuthToken }}
      imagePullSecrets:
        - name: {{ include "omnigate.fullname" . }}-omnigate-imagepull
{{- end }}
      initContainers:
{{- if include "omnigate.tlsAuto" . }}
        # No certificate supplied: make a self-signed one for the load balancer's address, the first time (kept on the data volume, so it survives
        # restarts; made again if the address changes). The app rejects an HTTPS request whose Host is not named in the certificate ("Invalid SNI"), so the
        # address has to be in it: the first step reads it from the Service, the second makes the certificate with the image's own keytool. Browsers
        # show a "not trusted" warning for it until you supply your own certificate (tls.keystore).
        - name: tls-address
          image: docker.io/library/python:3.12-slim
          command:
            - python
            - -c
            - |
              import json, os, ssl, time, urllib.request
              b = "/var/run/secrets/kubernetes.io/serviceaccount/"
              tok = open(b + "token").read(); ns = open(b + "namespace").read()
              ctx = ssl.create_default_context(cafile=b + "ca.crt")
              url = "https://%s:%s/api/v1/namespaces/%s/services/{{ include "omnigate.fullname" . }}-omnigate-http" % (os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"], ns)
              addrs = []
              for _ in range(180):
                  try:
                      req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
                      ing = json.load(urllib.request.urlopen(req, context=ctx, timeout=10)).get("status", {}).get("loadBalancer", {}).get("ingress", [])
                      addrs = sorted(x.get("ip") or x.get("hostname") for x in ing if x.get("ip") or x.get("hostname"))
                  except Exception as e:
                      print("waiting for the load balancer address:", e)
                  if addrs:
                      break
                  time.sleep(5)
              open("/work/address", "w").write(" ".join(addrs))
              print("load balancer address(es):", addrs or "none yet; the certificate will not name one")
          volumeMounts:
            - name: tls-work
              mountPath: /work
        - name: tls-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              D=/var/lib/omnigate/data/tls
              mkdir -p $D
              A=$(cat /work/address 2>/dev/null || true)
              if [ -s $D/omnigate.p12 ] && [ "$(cat $D/address 2>/dev/null)" = "$A" ]; then exit 0; fi
              rm -f $D/omnigate.p12
              SAN="dns:omnigate,dns:localhost"
              for a in $A; do case "$a" in *[a-zA-Z]*) SAN="$SAN,dns:$a";; *) SAN="$SAN,ip:$a";; esac; done
              keytool -genkeypair -alias omnigate -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 -keystore $D/omnigate.p12 \
                -storepass omnigate-selfsigned -keypass omnigate-selfsigned -dname "CN=omnigate" -ext "san=$SAN"
              printf '%s' "$A" > $D/address
          volumeMounts:
            - name: tls-work
              mountPath: /work
            - name: data
              mountPath: /var/lib/omnigate/data
{{- end }}
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "omnigate.postgresHost" . }} -U {{ .Values.postgres.user }}; do sleep 2; done
{{- if .Values.manufacturingDemo.enabled }}
{{- include "omnigate.manufacturingDemoInit" . | nindent 8 }}
{{- end }}
{{- include "omnigate.readOnlyRoleInit" . | nindent 8 }}
      containers:
        - name: omnigate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Least privilege for the app container only (the init containers, such as the database one, have their own needs): the image runs as 10001 since
          # 0.10.11, so say so, and drop everything it does not need. The root filesystem is read-only; the JVM and DuckDB write under /tmp, which is a scratch volume.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: {{ include "omnigate.fullname" . }}-omnigate-config
            - secretRef:
                name: {{ include "omnigate.fullname" . }}-omnigate-secret
          env:
            # The app's strict security profile (app versions after 0.10.11; ignored by older ones): deny unlisted tables and verify columns when a
            # policy is set, enforce the content security policy, and never run without sign-in.
            - name: OMNIGATE_SECURITY_PROFILE
              value: strict
{{- if include "omnigate.tlsCustom" . }}
            # A certificate the operator supplied is one browsers trust, so HSTS is safe to turn on (six months). With the self-signed default it is not.
            - name: OMNIGATE_HSTS_MAX_AGE_SECONDS
              value: "15552000"
{{- end }}
            # Signed licence that lets the free image run as the commercial edition (thinkingsense-ai/Server#18). The app re-reads
            # this file every minute. Whole-directory Secret mount (not subPath, which never updates); the Secret is its own
            # template (license.yaml), outside the checksum annotations, so changing it does not roll the pods.
            - name: OMNIGATE_LICENSE_FILE
              value: /etc/omnigate-license/license
{{- if include "omnigate.tlsCustom" . }}
            - name: OMNIGATE_TLS_KEYSTORE
              value: /etc/omnigate-tls/omnigate.p12
            - name: OMNIGATE_TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigate.fullname" . }}-omnigate-tls
                  key: password
{{- else if include "omnigate.tlsAuto" . }}
            - name: OMNIGATE_TLS_KEYSTORE
              value: /var/lib/omnigate/data/tls/omnigate.p12
            - name: OMNIGATE_TLS_KEYSTORE_PASSWORD
              value: omnigate-selfsigned
{{- end }}
          ports:
            - name: http
              containerPort: 8080
{{- if .Values.tls.enabled }}
            - name: https
              containerPort: 8443
{{- end }}
            - name: oracle-wire
              containerPort: 1521
            - name: pg-wire
              containerPort: 5433
            - name: mysql-wire
              containerPort: 3306
            - name: grpc
              containerPort: 7070
          volumeMounts:
            - name: license
              mountPath: /etc/omnigate-license
              readOnly: true
{{- if include "omnigate.tlsCustom" . }}
            - name: tls
              mountPath: /etc/omnigate-tls
              readOnly: true
{{- end }}
            - name: data
              mountPath: /var/lib/omnigate/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.omnigate | nindent 12 }}
      volumes:
{{- if include "omnigate.tlsAuto" . }}
        - name: tls-work
          emptyDir: {}
{{- end }}
        - name: license
          secret:
            secretName: {{ include "omnigate.fullname" . }}-omnigate-license
            optional: true
{{- if include "omnigate.tlsCustom" . }}
        - name: tls
          secret:
            secretName: {{ include "omnigate.fullname" . }}-omnigate-tls
{{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "omnigate.fullname" . }}-omnigate-data
        - name: tmp
          emptyDir: {}
---
# In-cluster only (ClusterIP): plain HTTP to the app for things running inside the cluster, such as the post-install question
# seeding. Always present, so they keep working when the public Service drops plain HTTP (tls.httpsOnly).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-internal
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# HTTP only (Ask app + admin console) -- the LoadBalancer default. Deliberately not exposing the
# DB wire ports here; see the wire-protocols Service below, which is opt-in.
#
# AKS's Standard-SKU LoadBalancer (the default since Kubernetes 1.19 on AKS) is already an L4 TCP
# passthrough load balancer, unlike the deprecated in-tree provisioner both the AWS and OCI stacks
# had to work around with their own annotations/controllers -- this matters because the OCI/AWS
# stacks confirmed live that an L7/classic LB buffers the Ask app's SSE (Server-Sent Events)
# streaming responses (a request would return 200 with only the first event and then hang
# indefinitely). `azure-load-balancer-internal: "false"` is the explicit opt-in for a public,
# internet-facing frontend IP (AKS's own default for `type: LoadBalancer`, made explicit here
# rather than relying on the cluster-wide default in case that default is ever changed).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-http
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: {{ .Values.service.type }}
  {{- with compact .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
{{- if not (and .Values.tls.enabled .Values.tls.httpsOnly) }}
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: 8080
{{- end }}
{{- if .Values.tls.enabled }}
    - name: https
      port: {{ .Values.tls.port }}
      targetPort: 8443
{{- end }}
{{- if .Values.omnigate.exposeWireProtocols }}
---
# Wire protocols (Oracle/Postgres/MySQL/gRPC), only created when exposeWireProtocols=true.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-wire
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: omnigate
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  {{- with compact .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: omnigate
  ports:
    - name: oracle-wire
      port: 1521
      targetPort: 1521
    - name: pg-wire
      port: 5433
      targetPort: 5433
    - name: mysql-wire
      port: 3306
      targetPort: 3306
    - name: grpc
      port: 7070
      targetPort: 7070
{{- end }}
