apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "omnigate.fullname" . }}-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "omnigate.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            # Cloud block-storage provisioners (confirmed on OCI Block Volume, AWS EBS) auto-create
            # a lost+found dir at the mount root, which fails initdb's "directory must be empty"
            # check -- point PGDATA at a clean subdirectory of the mounted volume instead, per the
            # postgres image's own documented workaround for this exact class of issue. Azure Disk
            # (ext4-formatted by default) is very likely to exhibit the same lost+found behavior,
            # so keeping this defensively even though not yet live-confirmed on AKS specifically.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "omnigate.fullname" . }}-postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: seed-supply-chain
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
      volumes:
        - name: seed-supply-chain
          configMap:
            name: {{ include "omnigate.fullname" . }}-seed-supply-chain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigate.postgresHost" . }}
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
