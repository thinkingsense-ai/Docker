apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGATE_LLM_API_KEY: {{ .Values.omnigate.llmApiKey | quote }}
{{- if .Values.omnigate.authUsers }}
  OMNIGATE_AUTH_USERS: {{ .Values.omnigate.authUsers | quote }}
{{- end }}
{{- if .Values.omnigate.adminApiToken }}
  OMNIGATE_AUTH_API_TOKENS: {{ printf "%s:admin" .Values.omnigate.adminApiToken | quote }}
{{- end }}
  OMNIGATE_APP_USERS: {{ required "omnigate.appUsers is required -- generate with `docker run --rm --entrypoint java <image> -cp omnigate.jar com.omnigate.http.auth.PasswordHash <password>` (see values.yaml). Refusing to deploy with the repo's well-known demo/demo login on an internet-facing LoadBalancer." .Values.omnigate.appUsers | quote }}
  # Three real schemas (see files/seed-supply-chain.sql) in ONE Postgres, registered as three
  # natural-named backends (suppliers/inventory/procurement) -- exactly the free edition's cap
  # of 3, no comma-merged schemas needed.
  #
  # Confirmed live on OCI/AWS (thinkingsense-ai/Server#5, thinkingsense-ai/Server#8): naming any
  # of these "default" is neither necessary nor sufficient -- an earlier version of this file did
  # that only to dodge a bug where SchemaIntrospector.sourcesFor() synthesizes an extra catalog
  # source from OMNIGATE_PG_HOST/DATABASE and collides with a same-named real backend. That
  # collision is now avoided a different way: OMNIGATE_PG_DATABASE (secrets.yaml's sibling
  # configmap.yaml) points at the plain `postgres`/public schema instead, which has no tables to
  # collide over, so these backends keep their real, natural names. Confirmed live that using
  # "default" as a backend name instead caused the opposite failure -- the LLM sometimes
  # generated SQL using the backend's registry name as if it were the real Postgres schema
  # (`JOIN default.suppliers` instead of `JOIN suppliers.suppliers`), which fails since "default"
  # isn't a real schema.
  OMNIGATE_BACKENDS: {{ printf "suppliers=jdbc:postgresql://%s:5432/%s?currentSchema=suppliers|%s|%s;inventory=jdbc:postgresql://%s:5432/%s?currentSchema=inventory|%s|%s;procurement=jdbc:postgresql://%s:5432/%s?currentSchema=procurement|%s|%s" (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password | quote }}
  # Pairs with the always-set OMNIGATE_PG_HOST/PORT/DATABASE/USER in configmap.yaml -- confirmed
  # live on OCI/AWS these must always be set, not just when wire protocols are exposed (see that
  # file's comment for why).
  OMNIGATE_PG_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-postgres-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
{{- if and .Values.image.pullUsername .Values.image.pullAuthToken }}
---
# Only rendered when image.pullUsername/pullAuthToken are set (see values.yaml's own comment) --
# a private image repository (e.g. a commercial build kept out of the free image's public,
# anonymously-pullable OCIR repo) needs OKE's nodes to actually authenticate to pull it, unlike
# the default public-repo path. Registry hostname is derived from image.repository itself
# (everything before the first "/"), not a separate setting, so it can't drift out of sync.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-imagepull
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # `| quote` is load-bearing, not cosmetic: this value starts with "{", and an unquoted YAML
  # scalar starting with "{" is parsed as a flow-style mapping, not a string -- confirmed live,
  # the Kubernetes API rejected the whole Secret ("cannot unmarshal object into Go struct field
  # Secret.stringData of type string") even though `helm template`'s raw text output looked
  # correct at a glance (it takes a real apply against a live API server to catch this, not just
  # reading the rendered YAML).
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" (first (splitList "/" .Values.image.repository)) .Values.image.pullUsername .Values.image.pullAuthToken (printf "%s:%s" .Values.image.pullUsername .Values.image.pullAuthToken | b64enc) | quote }}
{{- end }}
