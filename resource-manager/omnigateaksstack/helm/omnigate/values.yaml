# Defaults here are overridden by modules/deploymentScript.bicep's `helm upgrade --install
# --set ...` invocation when deployed as an ARM template -- see createUiDefinition.json for which
# of these become end-user form fields.

image:
  # Set by the deployment script -- defaults to the publisher's own public OCIR image (same
  # cross-cloud-reachable registry the AWS stack pulls directly, no ACR mirror needed).
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
  # Only needed for a private image repository (the commercial edition's image). Blank for the default public free-image path.
  # pullUsername is OCIR's "<tenancy-namespace>/<oci-username>"; pullAuthToken is an OCI Auth Token. When set, this chart creates a
  # kubernetes.io/dockerconfigjson Secret and wires it into the pod's imagePullSecrets; the registry hostname comes from
  # image.repository (everything before the first "/").
  pullUsername: ""
  pullAuthToken: ""

omnigate:
  llmModel: claude-sonnet-5
  # Anthropic API key -- required, no default on purpose (NL2SQL simply won't work without it,
  # same as the local compose setup and the AWS/OCI/GCP stacks). Injected into a Secret, never a
  # ConfigMap.
  llmApiKey: ""
  # "username:saltB64:hashB64::" -- generate with:
  #   docker run --rm --entrypoint java <image> -cp omnigate.jar com.omnigate.http.auth.PasswordHash <password>
  # No default: shipping the repo's well-known demo/demo credential on an internet-reachable
  # LoadBalancer would be a real exposure, so the chart intentionally requires this to be set.
  appUsers: ""
  # Admin console logins (OMNIGATE_AUTH_USERS: "user:saltB64:hashB64:admin[,...]"). Setting it turns admin
  # authentication on for the admin console, admin API and /mcp. The cloud stacks always set it; a bare
  # `helm install` leaves the admin console open.
  authUsers: ""
  # Bearer token with admin rights for the admin API (OMNIGATE_AUTH_API_TOKENS), for scripts.
  adminApiToken: ""
  # Signed licence token (ts1.<payload>.<signature>) that lets the free image run as the commercial edition. Blank keeps any
  # licence already in the cluster. See COMMERCIAL.md.
  license: ""
  # Storage for /var/lib/omnigate/data (the embedded ConfigStore -- admin-set config like an
  # API key entered live in the UI). This is exactly what bit us running locally under plain
  # `docker compose`: an anonymous volume that didn't survive a container recreate. A real PVC
  # here means it survives pod rescheduling.
  dataVolumeSize: 2Gi
  # Wire-protocol ports (Oracle/Postgres/MySQL/gRPC) are ClusterIP-only by default -- opt in
  # explicitly before exposing raw DB wire protocols to the internet.
  exposeWireProtocols: false

postgres:
  # Fully-qualified, not a bare "postgres:16-alpine" -- OKE's node runtime enforces short-name
  # mode and rejects a bare tag (confirmed live there). AKS/containerd hasn't been confirmed to
  # share that enforcement, but there's no cost to staying fully-qualified defensively here too.
  image: docker.io/library/postgres:16-alpine
  user: postgres
  password: postgres
  # The account the app itself connects as: SELECT-only, created (and its password set) by the ensure-readonly-role init
  # container on every pod start, so it also appears on a stack that was installed before this existed. Leave
  # readOnlyPassword blank to have one generated on first install and kept on every upgrade; set it only to choose your own.
  # The postgres superuser above is still used to create it, by the TPC-H loader and by backups.
  readOnlyUser: omnigate_ro
  readOnlyPassword: ""
  database: postgres
  storageSize: 5Gi

# AKS ships the Azure Disk CSI driver and this StorageClass by default -- no extra CSI install
# needed, unlike the AWS stack (which must install aws-ebs-csi-driver + a custom gp3
# StorageClass). Not live-confirmed on AKS specifically (no Azure account available while writing
# this stack) -- if a fresh cluster's default storage classes differ, check
# `kubectl get storageclass` and adjust this default.
storageClassName: managed-csi

service:
  type: LoadBalancer
  httpPort: 8080
  # Optional: CIDR ranges allowed to reach the load balancer (blank = open). The cloud stacks set this from
  # their "allowed client CIDRs" setting.
  loadBalancerSourceRanges: []

resources:
  omnigate:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # Deliberately no CPU limit -- the JVM and its embedding llama-server subprocess both run
      # in this one container, and a CPU *limit* (unlike a request) is enforced via a hard
      # per-scheduling-period CFS quota, which caused real, reproducible stalls on the OCI/AWS
      # stacks: complex NL2SQL questions needing the embedding-based schema-retrieval step would
      # hang indefinitely, while questions that skip that step worked instantly. Requests alone
      # still give the scheduler what it needs for bin-packing; only the throttling behavior was
      # the problem. Carrying this forward defensively for AKS even though not yet live-confirmed
      # here specifically.
      memory: 3Gi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Approves a few trusted questions for the seeded supply-chain demo after install, so the Ask app's first
# screen offers questions this data can answer (see templates/seed-questions.yaml). Needs the admin login
# (or omnigate.adminApiToken). Best effort: it never fails the release.
seedDemoQuestions:
  enabled: false
  adminUser: admin
  adminPassword: ""
  image: docker.io/library/python:3.12-slim   # runs the small seeding script (standard library only)

# HTTPS is on by default and plain HTTP is closed on the load balancer. The app serves HTTPS itself (the load balancer is a plain TCP
# pass-through, so the certificate is the app's): with no keystore given, a self-signed certificate is made at first start (browsers warn
# "not trusted" until you supply your own); a keystore (PKCS12, base64) replaces it, and changing it restarts the pods.
# What the app may read about its own deployment, for the admin Infrastructure page (thinkingsense-ai/Server#31). The app only ever reads:
# a namespace-scoped Role (pods, events, volume claims, services, workloads, disruption budgets) and, if "nodes" is on, a cluster-wide read of
# nodes (their ready state and zone). No secrets, no config maps, no pod logs, no exec, and no write of any kind. Switching "enabled" off removes
# the access entirely. Releases of the app before the Infrastructure page ignore all of this.
observability:
  kubernetes:
    enabled: true
    # Node readiness and zone need a ClusterRole (nodes are not namespaced). Turn off where policy forbids a cluster-wide read; the page then
    # shows pods and placement by node name only.
    nodes: true

tls:
  enabled: true
  httpsOnly: true         # false: the load balancer also exposes plain HTTP on 8080
  keystore: ""            # base64 of a PKCS12 file with your certificate and key
  keystorePassword: ""
  port: 443               # the load balancer's HTTPS port (forwards to the app's 8443)

# Restricts who may open a connection to the database pod (and, on OKE, the TPC-H object store) to the pods that need
# it. Enforced only where the cluster's network plugin enforces NetworkPolicy; see the stack README. Harmless elsewhere.
networkPolicy:
  enabled: true
