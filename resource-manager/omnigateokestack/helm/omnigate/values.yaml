# Defaults here are overridden by terraform/helm-release.tf when deployed as a Resource Manager
# Stack -- see terraform/schema.yaml for which of these become end-user "choices".

image:
  # Set by Terraform to the OCIR repo the stack just pushed to
  # (<region-key>.ocir.io/<tenancy-namespace>/omnigate).
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
  # Only needed for a private image repository (e.g. a commercial-edition build, kept out of the
  # public, anonymously-pullable OCIR repo the free image uses -- confirmed live that pushing a
  # commercial image to that same public repo would make it just as freely pullable as the free
  # one). Blank for the default public free-image path. pullUsername is OCIR's own
  # "<tenancy-namespace>/<oci-username>" format; pullAuthToken is an OCI Auth Token (`oci iam
  # auth-token create`), NOT your API signing key or console password -- generate one for
  # whichever principal should have pull rights. When set, this chart creates a
  # kubernetes.io/dockerconfigjson Secret and wires it into the pod's imagePullSecrets; the
  # registry hostname is taken from image.repository itself (everything before the first "/"),
  # not a separate setting.
  pullUsername: ""
  pullAuthToken: ""

omnigate:
  # Multi-node / HA: >1 replica behind the NLB Service below is real and supported, but ONLY
  # once configDb.external is also turned on (see that block's own comment) -- the default,
  # single-replica setup below uses a per-pod ReadWriteOnce PVC for /var/lib/omnigate/data,
  # which a second replica cannot also mount (block storage is single-attach). Raising
  # replicaCount alone, with configDb.external left off, leaves every extra pod crash-looping on
  # a PVC only the first pod can bind.
  replicaCount: 1
  # Real, distributed Ignite cluster mode (OMNIGATE_CLUSTER_ENABLED) -- commercial-edition only,
  # see com.omnigate.cluster.OmniGateCluster#isAllowed. A FREE-edition image logs a warning and
  # runs single-node anyway rather than failing, so leaving this true against a free image is
  # harmless, just a no-op. Distinct from (and independent of) configDb.external above:
  # clustering gives distributed cache/QoS coordination between replicas (Apache Ignite), while
  # configDb.external is what makes the admin-editable config itself consistent across replicas
  # -- cluster mode still requires configDb.external, since Ignite doesn't take over ConfigStore's
  # own storage. When true, this chart deploys a StatefulSet + headless Service instead of the
  # default Deployment, so each replica gets the stable per-pod DNS name Ignite's static
  # TcpDiscoveryVmIpFinder needs (see OMNIGATE_CLUSTER_SEED_NODES in configmap.yaml) -- the app
  # only supports a static host:port seed list, not Kubernetes-native pod discovery, so this
  # chart is what computes that list from replicaCount.
  clusterEnabled: false
  remoteJoinEnabled: true
  # Shared by every replica so an SSO login started on one pod can finish on another (needs app
  # v0.10.4+). The Terraform stack generates it; leave empty for a single replica with no SSO.
  oidcStateSecret: ""

  llmModel: claude-sonnet-5
  # Anthropic API key -- required, no default on purpose (NL2SQL simply won't work without it,
  # same as the local compose setup). Injected into a Secret, never a ConfigMap.
  llmApiKey: ""
  # "username:saltB64:hashB64::" -- generate with:
  #   docker run --rm --entrypoint java <image> -cp omnigate.jar com.omnigate.http.auth.PasswordHash <password>
  # No default: shipping the repo's well-known demo/demo credential on an internet-reachable
  # LoadBalancer would be a real exposure, so the chart intentionally requires this to be set.
  appUsers: ""
  # Storage for /var/lib/omnigate/data (the embedded ConfigStore -- admin-set config like an
  # API key entered live in the UI). This is exactly what bit us running locally under plain
  # `docker compose`: an anonymous volume that didn't survive a container recreate. A real PVC
  # here means it survives pod rescheduling. Ignored entirely when configDb.external is true
  # (see below) -- there is then no per-pod state left to persist this way.
  dataVolumeSize: 2Gi
  # Wire-protocol ports (Oracle/Postgres/MySQL/gRPC) are ClusterIP-only by default -- opt in
  # explicitly before exposing raw DB wire protocols to the internet.
  exposeWireProtocols: false
  configDb:
    # OMNIGATE_CONFIG_DB (real, existing app-level setting -- see com.omnigate.core.ConfigStore)
    # moves the admin-editable config store (backends, groups, LLM settings, everything an admin
    # can change live from the console) out of each pod's own local, single-attach PVC and into a
    # real, shared Postgres database every replica reads/writes -- the one change that makes
    # >1 replicas of THIS Deployment actually safe: with it off, every replica has its own,
    # unsynchronized local config store, and a second replica can't even mount the first's PVC.
    # False by default -- the free/single-node quick-start path is unaffected either way.
    external: false
    # Required (the chart refuses to render without these) once external=true -- deliberately NOT
    # defaulted to this chart's own bundled postgres.* demo instance, matching appUsers'/llmApiKey's
    # own "no silent fallback for anything architecture-sensitive" convention above. Real, honest
    # reasoning, not an arbitrary restriction: the bundled Postgres (postgres.* below) is a single,
    # non-HA pod with no separate schema/database provisioned for this purpose -- for genuine
    # end-to-end HA, point this at a real, separately-provisioned Postgres (OCI's own Database
    # service, or any reachable Postgres you already run) instead. configDbUrl is a plain JDBC URL,
    # e.g. "jdbc:postgresql://my-managed-db-host:5432/omnigate_config".
    configDbUrl: ""
    configDbUser: ""
    configDbPassword: ""

postgres:
  # Fully-qualified -- OKE's node runtime enforces short-name mode, so a bare "postgres:16-alpine"
  # is rejected as an ambiguous image reference (confirmed live: "short name mode is enforcing").
  image: docker.io/library/postgres:16-alpine
  user: postgres
  password: postgres
  database: postgres
  storageSize: 5Gi

storageClassName: oci-bv

service:
  type: LoadBalancer
  httpPort: 8080

resources:
  omnigate:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # Deliberately no CPU limit -- the JVM and its embedding llama-server subprocess both run
      # in this one container, and a CPU *limit* (unlike a request) is enforced via a hard
      # per-scheduling-period CFS quota, which caused real, reproducible stalls here: complex
      # NL2SQL questions needing the embedding-based schema-retrieval step would hang
      # indefinitely (confirmed live, isolated down to the container level, not the network/LB),
      # while questions that skip that step worked instantly. Requests alone still give the
      # scheduler what it needs for bin-packing; only the throttling behavior was the problem.
      memory: 3Gi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Opt-in TPC-H demo dataset: LINEITEM as Parquet in an in-cluster S3-compatible store, the other seven
# tables in a `tpch` database in the existing Postgres. Adds two OMNIGATE_BACKENDS entries (postgres1,
# lineitem), so on top of the three supply-chain demo backends this is five -- over the free edition's
# cap of three. Meant for commercial-edition images; see templates/tpch.yaml.
tpch:
  enabled: false
  scaleFactor: 1            # 1 == ~1GB of source data; keep postgres.storage large enough for the dims
  database: tpch
  bucket: tpch
  storageSize: 10Gi
  # SeaweedFS, pinned by digest (MinIO no longer publishes free images).
  s3Image: docker.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  loaderImage: docker.io/library/python:3.12-slim
  loaderDuckdbMemory: 2GB
  loaderMemoryLimit: 4Gi
