apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-config
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  # For the admin Infrastructure page (thinkingsense-ai/Server#31): how many replicas this release asked for (so a replica that never joined shows as
  # "1 of 2"), and how to find this deployment's pods when the Kubernetes view is on (observability-rbac.yaml grants the read access).
  OMNIGATE_EXPECTED_REPLICAS: {{ .Values.omnigate.replicaCount | quote }}
  OMNIGATE_KUBERNETES_VIEW: {{ .Values.observability.kubernetes.enabled | quote }}
  OMNIGATE_KUBERNETES_NODES: {{ and .Values.observability.kubernetes.enabled .Values.observability.kubernetes.nodes | quote }}
  OMNIGATE_KUBERNETES_SELECTOR: "app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=omnigate"
  # OMNIGATE_LLM_MODEL intentionally NOT set here. Setting it explicitly to "claude-sonnet-5"
  # (this chart's own values.yaml default) causes every Ask-app question to fail with a
  # NullPointerException in AnthropicLlmProvider.planSteps -- confirmed live on OKE, filed as
  # https://github.com/thinkingsense-ai/Server/issues/3. Leaving it unset falls back to the
  # app's own internal default model, which works correctly. Re-wire
  # `OMNIGATE_LLM_MODEL: {{ "{{" }} .Values.omnigate.llmModel | quote {{ "}}" }}` here once that
  # issue is fixed upstream.
  #
  # Routes each schema-qualified table reference to the backend name that owns it (see
  # OMNIGATE_BACKENDS in secrets.yaml) -- three schemas, three natural-named backends, no
  # merging needed (confirmed live this stays within the free edition's 3-backend cap).
{{- if include "omnigate.packs" . }}
  # all-packs: no schema-to-source rules. Every schema of each source is discovered and addressed connector.schema.table (pg.risk.incidents,
  # mdb.security.vendors, files.museums); a rule here would rewrite the schema part to the source name and break cross-source questions.
  OMNIGATE_FEDERATION_AUTO_DISCOVER_SCHEMAS: "true"
  OMNIGATE_FEDERATION_SCHEMA_INCLUDE: "suppliers,inventory,procurement,risk,smithsonian,security,museums,bom,treasury,erp"
  # Serve an approved question's saved SQL when a new question matches it closely (the packs' questions are checked to run).
  OMNIGATE_QUESTION_BANK_RETRIEVAL_ENABLED: "true"
  # The embedding model runs as its own Deployment (packs.yaml): question matching, the subject vocabulary and vector search call it there.
  OMNIGATE_EMBEDDING_REMOTE_HOST: {{ include "omnigate.embedHost" . | quote }}
  OMNIGATE_EMBEDDING_REMOTE_PORT: "8090"
{{- else }}
  OMNIGATE_ROUTER_SCHEMA_RULES: {{ default "suppliers:suppliers,inventory:inventory,procurement:procurement" (get (dict "it-risk" "risk:risk,security:security" "bom" "bom:bom" "treasury" "treasury:treasury,erp:erp") .Values.demoDataset) | quote }}
{{- if include "omnigate.embedding" . }}
  # bom and treasury: serve an approved question's saved SQL when a new question matches it; the embedding model runs as its own Deployment (packs.yaml).
  OMNIGATE_QUESTION_BANK_RETRIEVAL_ENABLED: "true"
  OMNIGATE_EMBEDDING_REMOTE_HOST: {{ include "omnigate.embedHost" . | quote }}
  OMNIGATE_EMBEDDING_REMOTE_PORT: "8090"
{{- end }}
{{- end }}
  # OMNIGATE_PG_HOST/PORT/DATABASE/USER are the wire-proxy surface's own single connection
  # target, distinct from OMNIGATE_BACKENDS (which populates the backend registry the Ask
  # app/NL2SQL actually queries against) -- but confirmed live these must ALWAYS be set, not
  # just when wire protocols are exposed: without them, agentic multi-step query execution
  # falls back to a hardcoded localhost:5432 default that doesn't exist, and every question
  # fails with "Connection to localhost:5432 refused". Deliberately pointed at the plain
  # `postgres` database with NO `?currentSchema=` override (i.e. Postgres's own empty `public`
  # schema) rather than any of the three real schemas: confirmed live (thinkingsense-ai/
  # Server#5) that SchemaIntrospector.sourcesFor() adds a synthetic extra catalog source from
  # these vars, and pointing it at `public` gives that synthetic source zero tables to collide
  # over, instead of duplicating (and confusing table ownership for) one of the real backends.
  OMNIGATE_PG_HOST: {{ include "omnigate.postgresHost" . | quote }}
  OMNIGATE_PG_PORT: "5432"
  OMNIGATE_PG_DATABASE: {{ .Values.postgres.database | quote }}
  OMNIGATE_PG_USER: {{ .Values.postgres.readOnlyUser | quote }}
{{- if .Values.omnigate.oidc.issuer }}
  # Single sign-on. The client secret is in secrets.yaml, not here.
  OMNIGATE_AUTH_OIDC_ISSUER: {{ .Values.omnigate.oidc.issuer | quote }}
  OMNIGATE_AUTH_OIDC_CLIENT_ID: {{ required "omnigate.oidc.clientId is required when omnigate.oidc.issuer is set" .Values.omnigate.oidc.clientId | quote }}
  OMNIGATE_AUTH_OIDC_SCOPES: {{ .Values.omnigate.oidc.scopes | quote }}
{{- if .Values.omnigate.oidc.adminUsers }}
  OMNIGATE_AUTH_OIDC_ADMIN_USERS: {{ .Values.omnigate.oidc.adminUsers | quote }}
{{- end }}
{{- if .Values.omnigate.oidc.adminGroups }}
  OMNIGATE_AUTH_OIDC_ADMIN_GROUPS: {{ .Values.omnigate.oidc.adminGroups | quote }}
{{- end }}
{{- if .Values.omnigate.oidc.groupsClaim }}
  OMNIGATE_AUTH_OIDC_GROUPS_CLAIM: {{ .Values.omnigate.oidc.groupsClaim | quote }}
{{- end }}
{{- end }}
  # ExitOnOutOfMemoryError: a heap failure otherwise leaves the JVM alive but wedged (found live: the pod stayed
  # Running, never Ready, and was never restarted, because the chart has no liveness probe). Exiting lets
  # Kubernetes restart it and makes the failure visible.
  JAVA_TOOL_OPTIONS: {{ printf "-XX:MaxRAMPercentage=%v -XX:+ExitOnOutOfMemoryError%s" .Values.omnigate.maxRamPercentage (ternary " -Dorg.slf4j.simpleLogger.log.com.omnigate.federationcore=debug" "" .Values.omnigate.debugFederation) | quote }}
{{- if .Values.omnigate.parallelJoinMinRows }}
  OMNIGATE_PARALLEL_JOIN_MIN_ROWS: {{ .Values.omnigate.parallelJoinMinRows | quote }}
{{- end }}
{{- if .Values.omnigate.clusterEnabled }}
  # Real Ignite cluster mode (commercial-edition only -- see values.yaml's own clusterEnabled
  # comment). The app only supports a static host:port seed list via TcpDiscoveryVmIpFinder, not
  # Kubernetes-native pod discovery, so this chart computes it from replicaCount: each entry is
  # one StatefulSet pod's stable DNS name against the headless Service defined in omnigate.yaml
  # (only rendered when clusterEnabled is true). 47500 is Ignite's TcpDiscoverySpi default port --
  # OmniGateCluster.java doesn't override it, so the default applies.
  OMNIGATE_CLUSTER_ENABLED: "true"
  OMNIGATE_CLUSTER_SEED_NODES: {{ $fullname := include "omnigate.fullname" . }}{{ $names := list }}{{ range $i := until (int .Values.omnigate.replicaCount) }}{{ $names = append $names (printf "%s-omnigate-%d.%s-omnigate-headless:47500" $fullname $i $fullname) }}{{ end }}{{ join "," $names | quote }}
  # Cross-node join dispatch is OFF in the app by default (OMNIGATE_PARALLEL_JOIN_REMOTE_ENABLED=false):
  # without this a cluster only shares cache/QoS/catalog, while every federated join still runs on
  # whichever single pod took the request. Turned on here whenever the cluster is, so the replicas
  # actually share query work; set omnigate.remoteJoinEnabled=false to opt out.
  OMNIGATE_PARALLEL_JOIN_REMOTE_ENABLED: {{ .Values.omnigate.remoteJoinEnabled | quote }}
{{- end }}
  # OMNIGATE_BACKENDS lives in secrets.yaml, not here -- it embeds the Postgres password, which
  # has no business sitting in a plaintext ConfigMap alongside a real Secret already carrying the
  # same value.
---
{{- if and (not (include "omnigate.standalone" .)) (not (include "omnigate.packs" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-supply-chain
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-supply-chain.sql: |
{{ .Files.Get "files/seed-supply-chain.sql" | indent 4 }}
---
{{- end }}
{{- if and .Values.manufacturingDemo.enabled (not (include "omnigate.standalone" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-manufacturing
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-manufacturing.sql: |
{{ .Files.Get "files/seed-manufacturing.sql" | indent 4 }}
{{- end }}

{{- if include "omnigate.packs" . }}
---
# The Postgres half of all-packs, run by the image's first-start entrypoint in file-name order on an empty volume: the supply-chain
# schemas, then the risk schema. Manufacturing is added by the ensure-manufacturing-demo init container, Smithsonian by the packs-loader Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-packs-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  01-seed-supply-chain.sql: |
{{ .Files.Get "files/seed-supply-chain.sql" | indent 4 }}
  02-seed-it-risk-postgres.sql: |
{{ .Files.Get "files/seed-it-risk-postgres.sql" | indent 4 }}
  03-seed-bom.sql: |
{{ .Files.Get "files/seed-bom.sql" | indent 4 }}
  04-seed-treasury-postgres.sql: |
{{ .Files.Get "files/seed-treasury-postgres.sql" | indent 4 }}
{{- end }}

{{- if eq .Values.demoDataset "bom" }}
---
# The BOM / sourcing pack (demos/bom-pack): one Postgres schema, `bom`. Run by the image's first-start entrypoint on an empty volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-bom-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-bom.sql: |
{{ .Files.Get "files/seed-bom.sql" | indent 4 }}
{{- end }}
{{- if eq .Values.demoDataset "treasury" }}
---
# The Treasury pack (demos/treasury-pack), Postgres half: the `treasury` schema. The ERP half is the `erp` MariaDB database below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-treasury-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-treasury-postgres.sql: |
{{ .Files.Get "files/seed-treasury-postgres.sql" | indent 4 }}
{{- end }}
{{- if include "omnigate.hasMariadb" . }}
{{- if eq .Values.demoDataset "it-risk" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-seed-it-risk-postgres
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  seed-it-risk-postgres.sql: |
{{ .Files.Get "files/seed-it-risk-postgres.sql" | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigate.fullname" . }}-{{ include "omnigate.mariadbSeedName" . }}
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
data:
  {{ ternary "01-seed-treasury.sql" "01-seed-it-risk.sql" (eq .Values.demoDataset "treasury") }}: |
{{ .Files.Get (ternary "files/seed-treasury-mariadb.sql" "files/seed-it-risk-mariadb.sql" (eq .Values.demoDataset "treasury")) | indent 4 }}
  # The image grants the account it creates (MARIADB_USER) everything on the database; narrow that to SELECT.
  02-readonly.sql: |
    REVOKE ALL PRIVILEGES ON {{ include "omnigate.mariadbDatabase" . }}.* FROM '{{ .Values.mariadb.readOnlyUser }}'@'%';
    GRANT SELECT ON {{ include "omnigate.mariadbDatabase" . }}.* TO '{{ .Values.mariadb.readOnlyUser }}'@'%';
    FLUSH PRIVILEGES;
{{- if include "omnigate.packs" . }}
  # all-packs also holds the Treasury pack's ERP database (`erp`) next to `security`: the same SELECT-only account reads it.
  03-seed-treasury-erp.sql: |
{{ .Files.Get "files/seed-treasury-mariadb.sql" | indent 4 }}
  04-readonly-erp.sql: |
    GRANT SELECT ON erp.* TO '{{ .Values.mariadb.readOnlyUser }}'@'%';
    FLUSH PRIVILEGES;
{{- end }}
{{- end }}
