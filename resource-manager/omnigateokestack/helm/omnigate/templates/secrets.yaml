{{- /*
The SELECT-only database account the app connects as (see the ensure-readonly-role init container in the pod template). Its
password is, in order: the one you set (postgres.readOnlyPassword), the one already stored in the -postgres-ro-secret Secret
(so an upgrade keeps it), or a new random one on first install. `lookup` needs a live cluster, so `helm template` and
`helm lint` show a fresh random value each time; that is expected.
*/ -}}
{{- /*
The postgres superuser's password, in order: the one you set (postgres.password), the one already stored in the -postgres-secret Secret
(so an upgrade keeps it, and a stack installed with the old default keeps "postgres"), or a new random one on first install. The Secret is
kept when the release is uninstalled (helm.sh/resource-policy: keep, below), so a reinstall onto the database volume the old release left
behind finds the same password; a volume initialised with one password and a Secret holding another would leave the database unreachable.
*/ -}}
{{- $suSecretName := printf "%s-postgres-secret" (include "omnigate.fullname" .) -}}
{{- $suPw := .Values.postgres.password -}}
{{- if not $suPw -}}
{{- $existingSu := lookup "v1" "Secret" .Release.Namespace $suSecretName -}}
{{- if and $existingSu $existingSu.data (hasKey $existingSu.data "POSTGRES_PASSWORD") -}}
{{- $suPw = index $existingSu.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $suPw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $roUser := .Values.postgres.readOnlyUser -}}
{{- $roSecretName := printf "%s-postgres-ro-secret" (include "omnigate.fullname" .) -}}
{{- $roPw := .Values.postgres.readOnlyPassword -}}
{{- if not $roPw -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $roSecretName -}}
{{- if and $existing $existing.data (hasKey $existing.data "PG_RO_PASSWORD") -}}
{{- $roPw = index $existing.data "PG_RO_PASSWORD" | b64dec -}}
{{- else -}}
{{- $roPw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $fullname := include "omnigate.fullname" . }}
{{- $demoBackends := printf "suppliers=jdbc:postgresql://%s:5432/%s?currentSchema=suppliers|%s|%s;inventory=jdbc:postgresql://%s:5432/%s?currentSchema=inventory|%s|%s;procurement=jdbc:postgresql://%s:5432/%s?currentSchema=procurement|%s|%s" (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw (include "omnigate.postgresHost" .) .Values.postgres.database $roUser $roPw }}
{{- if .Values.tpch.enabled }}
{{- $lineitemModel := dict "version" "1.0" "schemas" (list (dict "name" "lineitem" "type" "custom" "factory" "com.omnigate.calcite.s3.S3SchemaFactory" "operand" (dict "provider" "s3" "bucket" .Values.tpch.bucket "endpoint" (printf "http://%s-tpch-s3:9000" $fullname) "pathStyleAccess" true "region" "us-east-1" "accessKeyId" "tpch" "secretAccessKey" "tpch" "tables" (dict "lineitem" (dict "key" "lineitem.parquet" "format" "parquet"))))) }}
{{- if eq .Values.tpch.lineitemStore "s3" }}
{{- $demoBackends = printf "%s;postgres1=jdbc:postgresql://%s:5432/%s?currentSchema=public|%s|%s;lineitem=jdbc:calcite:model=inline:%s|" $demoBackends (include "omnigate.postgresHost" .) .Values.tpch.database .Values.postgres.user $suPw (toJson $lineitemModel) }}
{{- else }}
{{- $demoBackends = printf "%s;postgres1=jdbc:postgresql://%s:5432/%s?currentSchema=public|%s|%s;lineitem=jdbc:postgresql://%s:5432/%s?currentSchema=public|%s|%s" $demoBackends (include "omnigate.postgresHost" .) .Values.tpch.database .Values.postgres.user $suPw (include "omnigate.postgresHost" .) .Values.tpch.factDatabase .Values.postgres.user $suPw }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGATE_LLM_API_KEY: {{ .Values.omnigate.llmApiKey | quote }}
{{- if .Values.omnigate.authUsers }}
  OMNIGATE_AUTH_USERS: {{ .Values.omnigate.authUsers | quote }}
{{- end }}
{{- if .Values.omnigate.adminApiToken }}
  OMNIGATE_AUTH_API_TOKENS: {{ printf "%s:admin" .Values.omnigate.adminApiToken | quote }}
{{- end }}
{{- if .Values.omnigate.oidc.issuer }}
  OMNIGATE_AUTH_OIDC_CLIENT_SECRET: {{ required "omnigate.oidc.clientSecret is required when omnigate.oidc.issuer is set" .Values.omnigate.oidc.clientSecret | quote }}
{{- end }}
{{- if .Values.omnigate.oidcStateSecret }}
  # Signs the OIDC login-state cookie; must be identical on every replica (see values.yaml).
  OMNIGATE_OIDC_STATE_SECRET: {{ .Values.omnigate.oidcStateSecret | quote }}
{{- end }}
  OMNIGATE_APP_USERS: {{ required "omnigate.appUsers is required -- generate with `docker run --rm --entrypoint java <image> -cp omnigate.jar com.omnigate.http.auth.PasswordHash <password>` (see values.yaml). Refusing to deploy with the repo's well-known demo/demo login on an internet-facing LoadBalancer." .Values.omnigate.appUsers | quote }}
  # Three real schemas (see files/seed-supply-chain.sql) in ONE Postgres, registered as three
  # natural-named backends (suppliers/inventory/procurement) -- exactly the free edition's cap
  # of 3, no comma-merged schemas needed.
  #
  # Confirmed live (thinkingsense-ai/Server#5, thinkingsense-ai/Server#8): naming any of these
  # "default" is neither necessary nor sufficient -- an earlier version of this file did that
  # only to dodge a bug where SchemaIntrospector.sourcesFor() synthesizes an extra catalog
  # source from OMNIGATE_PG_HOST/DATABASE and collides with a same-named real backend. That
  # collision is now avoided a different way: OMNIGATE_PG_DATABASE (secrets.yaml's sibling
  # configmap.yaml) points at the plain `postgres`/public schema instead, which has no tables to
  # collide over, so these backends keep their real, natural names. Confirmed live that using
  # "default" as a backend name instead caused the opposite failure -- the LLM sometimes
  # generated SQL using the backend's registry name as if it were the real Postgres schema
  # (`JOIN default.suppliers` instead of `JOIN suppliers.suppliers`), which fails since "default"
  # isn't a real schema.
  OMNIGATE_BACKENDS: {{ $demoBackends | quote }}
  # Pairs with the always-set OMNIGATE_PG_HOST/PORT/DATABASE/USER in configmap.yaml -- confirmed
  # live these must always be set, not just when wire protocols are exposed (see that file's
  # comment for why).
  OMNIGATE_PG_PASSWORD: {{ $roPw | quote }}
{{- if .Values.omnigate.configDb.external }}
  # Real, app-level OMNIGATE_CONFIG_DB (jdbcUrl|user|password -- see com.omnigate.core.ConfigStore)
  # -- moves the admin-editable config store off each pod's own local PVC and into the shared,
  # separately-provisioned Postgres named below, which is what makes omnigate.replicaCount > 1
  # actually safe (see values.yaml's own configDb comment). `required` here matches
  # appUsers'/llmApiKey's own established "no silent fallback" convention for this chart.
  OMNIGATE_CONFIG_DB: {{ printf "%s|%s|%s" (required "omnigate.configDb.configDbUrl is required when omnigate.configDb.external is true -- a real, separately-provisioned Postgres JDBC URL, e.g. jdbc:postgresql://host:5432/omnigate_config (see values.yaml)." .Values.omnigate.configDb.configDbUrl) (required "omnigate.configDb.configDbUser is required when omnigate.configDb.external is true (see values.yaml)." .Values.omnigate.configDb.configDbUser) (required "omnigate.configDb.configDbPassword is required when omnigate.configDb.external is true (see values.yaml)." .Values.omnigate.configDb.configDbPassword) | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-postgres-secret
  annotations:
    # Not removed by `helm uninstall`: see the note at the top of this file.
    "helm.sh/resource-policy": keep
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $suPw | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
{{- if and .Values.image.pullUsername .Values.image.pullAuthToken }}
---
# Only rendered when image.pullUsername/pullAuthToken are set (see values.yaml's own comment) --
# a private image repository (e.g. a commercial build kept out of the free image's public,
# anonymously-pullable OCIR repo) needs OKE's nodes to actually authenticate to pull it, unlike
# the default public-repo path. Registry hostname is derived from image.repository itself
# (everything before the first "/"), not a separate setting, so it can't drift out of sync.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-imagepull
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # `| quote` is load-bearing, not cosmetic: this value starts with "{", and an unquoted YAML
  # scalar starting with "{" is parsed as a flow-style mapping, not a string -- confirmed live,
  # the Kubernetes API rejected the whole Secret ("cannot unmarshal object into Go struct field
  # Secret.stringData of type string") even though `helm template`'s raw text output looked
  # correct at a glance (it takes a real apply against a live API server to catch this, not just
  # reading the rendered YAML).
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" (first (splitList "/" .Values.image.repository)) .Values.image.pullUsername .Values.image.pullAuthToken (printf "%s:%s" .Values.image.pullUsername .Values.image.pullAuthToken | b64enc) | quote }}
{{- end }}

---
# The app's SELECT-only database account (created by the ensure-readonly-role init container; used by the init container
# and, through OMNIGATE_BACKENDS / OMNIGATE_PG_PASSWORD above, by the app). Kept as its own Secret so an upgrade can read the
# generated password back with `lookup` instead of generating a new one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $roSecretName }}
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  PG_RO_USER: {{ $roUser | quote }}
  PG_RO_PASSWORD: {{ $roPw | quote }}
