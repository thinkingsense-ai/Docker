apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGATE_LLM_API_KEY: {{ .Values.omnigate.llmApiKey | quote }}
  OMNIGATE_APP_USERS: {{ required "omnigate.appUsers is required -- generate with `docker run --rm --entrypoint java <image> -cp omnigate.jar com.omnigate.http.auth.PasswordHash <password>` (see values.yaml). Refusing to deploy with the repo's well-known demo/demo login on an internet-facing LoadBalancer." .Values.omnigate.appUsers | quote }}
  OMNIGATE_BACKENDS: {{ printf "demo=jdbc:postgresql://%s:5432/%s|%s|%s" (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password | quote }}
  OMNIGATE_PG_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-postgres-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
