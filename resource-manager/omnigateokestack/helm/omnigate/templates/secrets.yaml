apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-omnigate-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGATE_LLM_API_KEY: {{ .Values.omnigate.llmApiKey | quote }}
  OMNIGATE_APP_USERS: {{ required "omnigate.appUsers is required -- generate with `docker run --rm --entrypoint java <image> -cp omnigate.jar com.omnigate.http.auth.PasswordHash <password>` (see values.yaml). Refusing to deploy with the repo's well-known demo/demo login on an internet-facing LoadBalancer." .Values.omnigate.appUsers | quote }}
  # Four real schemas (see files/seed-supply-chain.sql) in ONE Postgres, registered as three
  # named backends -- the free edition caps at 3, so inventory and logistics share one backend
  # via a comma-separated ?currentSchema= (a real, native Postgres search_path, not app-level
  # emulation; confirmed live in the source fixture this was copied from --
  # fixtures/supply-chain/single-postgres/docker-compose.yml -- that `SET search_path TO
  # inventory,logistics` genuinely resolves tables from both schemas unqualified).
  #
  # Confirmed live (thinkingsense-ai/Server#5): naming any of these "default" is neither
  # necessary nor sufficient by itself -- the earlier single-backend version of this file needed
  # that name only because OMNIGATE_PG_HOST/OMNIGATE_PG_DATABASE were always set, which made the
  # Ask app's query planner synthesize an extra "default"-named catalog source that collided with
  # the real one. Those vars are now omitted unless exposeWireProtocols is enabled (see
  # configmap.yaml), so that collision doesn't apply here with real, natural backend names --
  # except if wire protocols ARE enabled, in which case the wire-proxy's own single connection
  # target (scoped to the "suppliers" schema) can still collide with the "suppliers" backend
  # below the same way, a known limitation carried over from the source fixture.
  OMNIGATE_BACKENDS: {{ printf "suppliers=jdbc:postgresql://%s:5432/%s?currentSchema=suppliers|%s|%s;inventory=jdbc:postgresql://%s:5432/%s?currentSchema=inventory,logistics|%s|%s;procurement=jdbc:postgresql://%s:5432/%s?currentSchema=procurement|%s|%s" (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password (include "omnigate.postgresHost" .) .Values.postgres.database .Values.postgres.user .Values.postgres.password | quote }}
{{- if .Values.omnigate.exposeWireProtocols }}
  OMNIGATE_PG_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigate.fullname" . }}-postgres-secret
  labels:
    {{- include "omnigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
