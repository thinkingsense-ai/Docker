# Adds the simulated exposure estate (schema `estate`) to the all-packs stack, for the local Agency sandbox. Add it after demos/it-risk-rca/docker-compose.rca.yml (agency/local/up.sh does):
#   docker compose -f docker-compose.yml -f demos/all-packs/docker-compose.packs.yml -f demos/it-risk-rca/docker-compose.rca.yml -f demos/it-risk-estate/docker-compose.estate.yml up --build
# Postgres runs init files only on a FRESH volume, so an existing stack must be wiped (agency/local/up.sh down) or the seed loaded by hand.
# The approved questions are merged by agency/local/up.sh into agency/local/.runtime/demo-questions.json. Everything here is invented. Not in the cloud charts.
services:
  postgres:
    volumes:
      - ./demos/it-risk-estate/seed-estate-postgres.sql:/docker-entrypoint-initdb.d/03c-estate.sql:ro
      - ./demos/it-risk-estate/grant-estate.sql:/docker-entrypoint-initdb.d/07b-estate-grant.sql:ro
  omnigate:
    environment:
      OMNIGATE_FEDERATION_SCHEMA_INCLUDE: "suppliers,inventory,procurement,risk,smithsonian,security,museums,bom,treasury,erp,rca,estate"
