# Builds the three Agency images and publishes them to Google Artifact Registry (the public `omnigate` repository the app image already uses, so there is no visibility step): `agency` (the thinking layer and the built UI: addons/thinking-layer/Dockerfile) and `agency-workflows`
# (the workflow worker and gateway with the Temporal SDK and the psql client: demos/payment-workflow/Dockerfile), which is public and needs no secret beyond the
# workflow's own token. The cloud stacks run it as `agency.image`. It is not tied to an app release: run it by hand, or push a tag `agency-image-vX.Y.Z`.
#   Actions > Build Agency image > Run workflow (tag: 0.1.1, push on), or: git tag agency-image-v0.1.1 && git push origin agency-image-v0.1.1
# Multi-architecture (amd64 and arm64: the stacks run on Graviton, Ampere and x86 nodes). It needs the repository secret GAR_SERVICE_ACCOUNT_KEY that the Build images workflow uses (a service account
# with Artifact Registry Writer on the omnigate repository). The step summary prints the digest to pin in the charts' values (agency.image, agency.workflows.image).
name: Build Agency image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 0.1.1"
        required: true
      push:
        description: "Push the image. Leave off for a dry run that only builds it."
        type: boolean
        default: false
  push:
    tags: ["agency-image-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { image: us-docker.pkg.dev/thinkingsense/omnigate/agency, context: ., file: addons/thinking-layer/Dockerfile }
          - { image: us-docker.pkg.dev/thinkingsense/omnigate/agency-workflows, context: demos/payment-workflow, file: demos/payment-workflow/Dockerfile }
          - { image: us-docker.pkg.dev/thinkingsense/omnigate/agency-feed, context: addons/feed-adapter, file: addons/feed-adapter/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUSH: ${{ inputs.push }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then tag="$INPUT_TAG"; push="$INPUT_PUSH"; else tag="${REF_NAME#agency-image-v}"; push=true; fi
          printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "::error::'$tag' is not a version like 0.1.1"; exit 1; }
          { echo "tag=$tag"; echo "push=$push"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Artifact Registry
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_SERVICE_ACCOUNT_KEY }}
      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.vars.outputs.push == 'true' }}
          tags: ${{ matrix.image }}:${{ steps.vars.outputs.tag }}
      - name: Digest to pin
        if: steps.vars.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "### Agency image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$TAG\` digest \`$DIGEST\`: pin it in the stack charts values (agency.image for agency, agency.workflows.image for agency-workflows) with scripts/sync-agency-addon.py, then run the stack clean-room." >> "$GITHUB_STEP_SUMMARY"
