# Generated by scripts/packs.py from packs/*/pack.json. Do not edit; run `python3 scripts/packs.py generate`.
# Load on the all-packs stack with: PUT /api/config/groups  body {"yaml": <this file>}  (admin session). It is a ConfigStore key, not an environment variable.
# `all-data` is needed: once every backend belongs to a group the Server's Default workspace is empty, so All data would answer nothing.
# A Workspace scopes by backend only: every pack on `pg` still sees every Postgres schema. Schema-level scope needs a Server change
# (docs/agency-design.md, "A pack is a Workspace"); until then the catalogue's `sources[].schemas` is the intended scope.
namespaces:
  - id: all-data
    name: "All data"
    backends: ["files", "mdb", "pg"]
  - id: bom
    name: "Manufacturing BOM and sourcing"
    backends: ["pg"]
  - id: it-risk
    name: "IT and operational risk"
    backends: ["pg", "mdb"]
  - id: manufacturing
    name: "Manufacturing sourcing"
    backends: ["pg"]
  - id: smithsonian
    name: "Smithsonian Open Access sample"
    backends: ["pg", "files"]
  - id: supply-chain
    name: "Supply chain"
    backends: ["pg"]
  - id: treasury
    name: "Treasury"
    backends: ["pg", "mdb"]
