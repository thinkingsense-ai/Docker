    name: "Manufacturing BOM and sourcing"
    backends: ["pg"]
  - id: it-risk
    name: "IT and operational risk"
    backends: ["pg", "mdb"]
  - id: manufacturing
    name: "Manufacturing sourcing"
    backends: ["pg"]
  - id: smithsonian
    name: "Smithsonian Open Access sample"
    backends: ["pg", "files"]
  - id: supply-chain
    name: "Supply chain"
    backends: ["pg"]
  - id: treasury
    name: "Treasury"
    backends: ["pg", "mdb"]
